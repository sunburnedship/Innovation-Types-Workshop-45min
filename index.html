// Roll a question-score map (keys "Type:i", values 0–3) up to 0–10 type scores.
// A type gets a score only when every one of its questions is answered.
const rollUpTypeScores = (qs) => {
  const out = {};
  TYPES_ORDER.forEach(t => {
    const r = computeTypeScore(t, qs);
    out[t] = r.scored === r.total ? r.score : null;
  });
  return out;
};

// Total Innovation Score: sum of the ten 0–10 type scores → 0–100. Null until all ten are complete.
const totalFromTypeScores = (typeScores) => {
  const vals = TYPES_ORDER.map(t => typeScores[t]);
  if (vals.some(v => typeof v !== "number")) return null;
  return vals.reduce((a, b) => a + b, 0);
};

const countStrong = (typeScores) =>
  TYPES_ORDER.filter(t => typeof typeScores[t] === "number" && typeScores[t] >= STRONG_THRESHOLD).length;

const questionCode = (typeName, i) => `${TYPE_CODES[typeName]}${i + 1}`;

// Structured tactic recommendation. Older saves stored a single "justification" string.
const TACTIC_FIELDS = [
  { key: "gap",      label: "Gap it addresses",       placeholder: "Which weakness or untapped opportunity does this tactic attack?" },
  { key: "evidence", label: "Evidence",               placeholder: "Cite your scoring or the AI responses — e.g., 'SV3 scored 0 by team and both AIs: no distinctive warranty.'" },
  { key: "adoption", label: "What adoption requires", placeholder: "Capability, investment, partner, or what the company would have to stop doing." },
];
const normalizeTactic = (r) => ({
  type: r.type, name: r.name,
  gap: r.gap ?? r.justification ?? "",
  evidence: r.evidence ?? "",
  adoption: r.adoption ?? "",
});
const tacticComplete = (r) => TACTIC_FIELDS.every(f => (r[f.key] || "").trim().length > 0);

const computeTypeScore = (typeName, qs) => {
  const w = WEIGHTS[typeName];
  const idxs = QUESTIONS.map((q, i) => q.type === typeName ? i : -1).filter(i => i >= 0);
  let sum = 0;
  let scored = 0;
  idxs.forEach(globalIdx => {
    const localIdx = QUESTIONS.slice(0, globalIdx).filter(q => q.type === typeName).length;
    const v = qs[`${typeName}:${localIdx}`];
    if (typeof v === "number") {
      sum += v * w;
      scored++;
    }
  });
  return { score: sum, scored, total: idxs.length };
};

// Parse an AI response that answers the diagnostic questions as lines like
//   "PM1: 2 | evidence"   — also tolerates markdown bold, bullets, tables ("| PM1 | 2 | evidence |"),
//   "PM-1 = 2 — evidence", "PM1 (2/3): evidence", and echoed question text before the score.
// Returns { scores: { "Type:i": 0–3 }, evidence: { "Type:i": "..." }, summary: "..." }.
const parseAIResponse = (text) => {
  const scores = {};
  const evidence = {};
  if (!text) return { scores, evidence, summary: "" };
  const codeRe = /(?:^|[^A-Za-z])(PM|NW|ST|PR|PP|PS|SV|CH|BR|CE)\s*[-_.]?\s*(\d)(?!\d)/i;
  const leftover = [];
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.replace(/\*\*|__|`/g, "");
    const m = line.match(codeRe);
    let matched = false;
    if (m && m.index <= 12) {
      const typeName = CODE_TO_TYPE[m[1].toUpperCase()];
      const qIdx = parseInt(m[2], 10) - 1;
      const nQ = QUESTIONS.filter(q => q.type === typeName).length;
      if (typeName && qIdx >= 0 && qIdx < nQ) {
        const rest = line.slice(m.index + m[0].length);
        // 1) Score immediately after the code: "PM1: 2 | ..." / "| PM1 | 2 |" / "PM1 (2/3)"
        let sm = rest.match(/^[\s:=|.)(\]\-–—]*([0-3])(?:\.0+)?(?!\d)\s*(?:\/\s*3)?\s*\)?(.*)$/);
        // 2) Fallback: question text echoed first, score after a separator: "PM1. Does ...? — 2 | ..."
        if (!sm) sm = rest.match(/(?:[:|—–=]|score\s*[:=]?)\s*([0-3])(?:\.0+)?(?!\d)\s*(?:\/\s*3)?\s*(?:[|—–:\-]\s*(.*)|$)/i);
        if (sm) {
          const key = `${typeName}:${qIdx}`;
          scores[key] = parseInt(sm[1], 10);
          const ev = (sm[2] || "").replace(/^[\s|:\-–—]+/, "").replace(/[\s|]+$/, "").trim();
          if (ev) evidence[key] = ev;
          matched = true;
        }
      }
    }
    if (!matched) leftover.push(rawLine);
  }
  // The strength/gap paragraph: longest leftover paragraph that isn't a header.
  const paras = leftover.join("\n").split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 80);
  const summary = paras.sort((a, b) => b.length - a.length)[0] || "";
  return { scores, evidence, summary };
};

const buildAIPrompt = (companyName, companyContext) => {
  const name = companyName || "[COMPANY NAME]";
  const asOf = new Date().toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const scope = companyContext.trim() ? `\nScope set by the team: ${companyContext.trim()}\n` : "";
  const qBlock = TYPES_ORDER.map(t => {
    const qs = QUESTIONS.filter(q => q.type === t);
    return `${t.toUpperCase()}\n` + qs.map((q, i) => `${questionCode(t, i)}. ${q.text}`).join("\n");
  }).join("\n\n");
  return `You are an expert innovation analyst. Assess ${name} using Larry Keeley's Doblin Ten Types of Innovation framework (Keeley et al., 2013). Use publicly available information as of ${asOf}. If you can search the web, do so before answering.
${scope}
Answer each of the ${NQ} diagnostic questions below on this 0–3 scale, judged relative to direct competitors and industry norms:
${RUBRIC.map(r => `  ${r.n} = ${r.label} — ${r.desc}`).join("\n")}
If you cannot find public evidence for a question, score it 0 and write "no public evidence".

Return exactly one line per question, in this format, using the code shown:
CODE: SCORE | one-sentence evidence

Example:
PM1: 2 | Sells hardware near cost and earns most of its margin on subscriptions.

Rules: list all ${NQ} codes in order; do not use a table; do not add type totals or 0–10 scores (the workshop calculates those).

${qBlock}

After the ${NQ} lines, write one short paragraph (3–4 sentences) naming the company's single biggest innovation strength and single biggest gap, with one concrete piece of evidence for each.`;
};

const escapeHTML = (s) => String(s ?? "")
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

// ============================================================
// MAIN COMPONENT
// ============================================================

function InnovationWorkshop() {
  const [phase, setPhase] = useState(0);
  const [companyName, setCompanyName] = useState("");
  const [companyContext, setCompanyContext] = useState("");
  const [teamName, setTeamName] = useState("");

  const [questionScores, setQuestionScores] = useState(initialQuestionScores());
  const [typeEvidence, setTypeEvidence] = useState(initialTypeEvidence());

  const [ai1Name, setAi1Name] = useState("");
  const [ai1Raw, setAi1Raw] = useState("");
  const [ai1Edits, setAi1Edits] = useState({}); // manual per-question fixes, override parsed scores

  const [ai2Name, setAi2Name] = useState("");
  const [ai2Raw, setAi2Raw] = useState("");
  const [ai2Edits, setAi2Edits] = useState({});

  const [tacticRecs, setTacticRecs] = useState([]);

  const [copied1, setCopied1] = useState(false);
  const [copied2, setCopied2] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [summaryOpen, setSummaryOpen] = useState(false);
  const [summaryCopied, setSummaryCopied] = useState(false);

  // Load persisted
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(STORAGE_KEY);
        if (r && r.value) {
          const s = JSON.parse(r.value);
          if (s.companyName !== undefined) setCompanyName(s.companyName);
          if (s.companyContext !== undefined) setCompanyContext(s.companyContext);
          if (s.teamName !== undefined) setTeamName(s.teamName);
          if (s.questionScores) setQuestionScores(s.questionScores);
          if (s.typeEvidence) setTypeEvidence(s.typeEvidence);
          if (s.ai1Name) setAi1Name(s.ai1Name);
          if (s.ai1Raw) setAi1Raw(s.ai1Raw);
          if (s.ai1Edits) setAi1Edits(s.ai1Edits);
          if (s.ai2Name) setAi2Name(s.ai2Name);
          if (s.ai2Raw) setAi2Raw(s.ai2Raw);
          if (s.ai2Edits) setAi2Edits(s.ai2Edits);
          if (s.tacticRecs) setTacticRecs(s.tacticRecs.map(normalizeTactic));
          if (typeof s.phase === "number") setPhase(s.phase);
        }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  // Persist
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify({
          phase, companyName, companyContext, teamName,
          questionScores, typeEvidence,
          ai1Name, ai1Raw, ai1Edits, ai2Name, ai2Raw, ai2Edits,
          tacticRecs,
        }));
      } catch (e) {}
    })();
  }, [phase, companyName, companyContext, teamName, questionScores, typeEvidence,
      ai1Name, ai1Raw, ai1Edits, ai2Name, ai2Raw, ai2Edits, tacticRecs, loaded]);

  // Parse AI responses question-by-question, apply manual fixes, roll up to type scores
  const ai1Parsed = useMemo(() => parseAIResponse(ai1Raw), [ai1Raw]);
  const ai2Parsed = useMemo(() => parseAIResponse(ai2Raw), [ai2Raw]);
  const ai1Q = useMemo(() => ({ ...ai1Parsed.scores, ...ai1Edits }), [ai1Parsed, ai1Edits]);
  const ai2Q = useMemo(() => ({ ...ai2Parsed.scores, ...ai2Edits }), [ai2Parsed, ai2Edits]);
  const ai1Scores = useMemo(() => rollUpTypeScores(ai1Q), [ai1Q]);
  const ai2Scores = useMemo(() => rollUpTypeScores(ai2Q), [ai2Q]);

  // Computed
  const teamTypeScores = useMemo(() => {
    const obj = {};
    TYPES_ORDER.forEach(t => { obj[t] = computeTypeScore(t, questionScores); });
    return obj;
  }, [questionScores]);

  const teamTypeFinal = useMemo(() => {
    const obj = {};
    TYPES_ORDER.forEach(t => { const s = teamTypeScores[t]; obj[t] = s.scored === s.total ? s.score : null; });
    return obj;
  }, [teamTypeScores]);

  const teamTotal = useMemo(() => totalFromTypeScores(teamTypeFinal), [teamTypeFinal]);
  const ai1Total = useMemo(() => totalFromTypeScores(ai1Scores), [ai1Scores]);
  const ai2Total = useMemo(() => totalFromTypeScores(ai2Scores), [ai2Scores]);

  // Question-level three-way comparison (the payoff of using one instrument for all three sources)
  const questionGaps = useMemo(() => {
    const rows = [];
    TYPES_ORDER.forEach(t => {
      QUESTIONS.filter(q => q.type === t).forEach((q, i) => {
        const key = `${t}:${i}`;
        const team = questionScores[key], a1 = ai1Q[key], a2 = ai2Q[key];
        if (typeof team !== "number" || typeof a1 !== "number" || typeof a2 !== "number") return;
        const aiMean = (a1 + a2) / 2;
        rows.push({
          key, type: t, idx: i, code: questionCode(t, i), text: q.text,
          team, ai1: a1, ai2: a2,
          teamVsAI: team - aiMean,
          aiSpread: Math.abs(a1 - a2),
          ev1: ai1Parsed.evidence[key] || "", ev2: ai2Parsed.evidence[key] || "",
        });
      });
    });
    return rows;
  }, [questionScores, ai1Q, ai2Q, ai1Parsed, ai2Parsed]);

  // Five-type threshold projection: strong types now (team) + weak types the chosen tactics attack
  const projectedStrong = useMemo(() => {
    const set = new Set(TYPES_ORDER.filter(t => typeof teamTypeFinal[t] === "number" && teamTypeFinal[t] >= STRONG_THRESHOLD));
    tacticRecs.forEach(r => set.add(r.type));
    return set.size;
  }, [teamTypeFinal, tacticRecs]);

  const teamComplete = useMemo(() => {
    return TYPES_ORDER.every(t => teamTypeScores[t].scored === teamTypeScores[t].total);
  }, [teamTypeScores]);

  const ai1Complete = useMemo(() => TYPES_ORDER.every(t => typeof ai1Scores[t] === "number"), [ai1Scores]);
  const ai2Complete = useMemo(() => TYPES_ORDER.every(t => typeof ai2Scores[t] === "number"), [ai2Scores]);

  const teamAvg = useMemo(() => {
    const vals = TYPES_ORDER.map(t => teamTypeScores[t].scored === teamTypeScores[t].total ? teamTypeScores[t].score : null).filter(v => v !== null);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }, [teamTypeScores]);

  const ai1Avg = useMemo(() => {
    const vals = TYPES_ORDER.map(t => ai1Scores[t]).filter(v => typeof v === "number");
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }, [ai1Scores]);

  const ai2Avg = useMemo(() => {
    const vals = TYPES_ORDER.map(t => ai2Scores[t]).filter(v => typeof v === "number");
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }, [ai2Scores]);

  const triangulation = useMemo(() => {
    const items = TYPES_ORDER.map(t => {
      const team = teamTypeScores[t].scored === teamTypeScores[t].total ? teamTypeScores[t].score : null;
      const a1 = ai1Scores[t];
      const a2 = ai2Scores[t];
      if (team == null || typeof a1 !== "number" || typeof a2 !== "number") return null;
      const aiAvg = (a1 + a2) / 2;
      return {
        type: t,
        team, ai1: a1, ai2: a2,
        aiAvg,
        teamVsAI: team - aiAvg,
        aiSpread: Math.abs(a1 - a2),
        spread: Math.max(team, a1, a2) - Math.min(team, a1, a2),
      };
    }).filter(Boolean);
    return items;
  }, [teamTypeScores, ai1Scores, ai2Scores]);

  const handleReset = async () => {
    if (!window.confirm("Reset everything? This will clear all scores, evidence, AI responses, and tactic recommendations.")) return;
    setPhase(0);
    setCompanyName(""); setCompanyContext(""); setTeamName("");
    setQuestionScores(initialQuestionScores());
    setTypeEvidence(initialTypeEvidence());
    setAi1Name(""); setAi1Raw(""); setAi1Edits({});
    setAi2Name(""); setAi2Raw(""); setAi2Edits({});
    setTacticRecs([]);
    try { await window.storage.delete(STORAGE_KEY); } catch (e) {}
  };

  // ============================================================
  // EXPORT — Word doc (HTML+MSO) + plain-text fallback
  // ============================================================

  const buildWordHTML = () => {
    const dateStr = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    const catColorHex = (cat) => ({ Configuration: "#7C3AED", Offering: "#059669", Experience: "#EA580C" })[cat];
    const teamColorHex = "#EA580C";
    const ai1ColorHex = "#059669";
    const ai2ColorHex = "#7C3AED";
    const fmt = (v) => v !== null && v !== undefined && !isNaN(v) ? v.toFixed(2) : "—";
    const fmt1 = (v) => v !== null && v !== undefined && !isNaN(v) ? v.toFixed(1) : "—";

    const scoreRows = TYPES_ORDER.map(t => {
      const team = teamTypeScores[t];
      const teamStr = team.scored === team.total ? team.score.toFixed(2) : "—";
      const a1 = typeof ai1Scores[t] === "number" ? ai1Scores[t].toFixed(2) : "—";
      const a2 = typeof ai2Scores[t] === "number" ? ai2Scores[t].toFixed(2) : "—";
      const cat = TYPE_INFO[t].category;
      return `<tr>
        <td><strong>${escapeHTML(t)}</strong></td>
        <td><span style="color:${catColorHex(cat)};font-size:9pt;font-weight:600;">${cat}</span></td>
        <td class="num">${teamStr}</td>
        <td class="num">${a1}</td>
        <td class="num">${a2}</td>
      </tr>`;
    }).join("\n");

    const recCats = [...new Set(tacticRecs.map(r => TYPE_INFO[r.type].category))];
    const tacticBlocks = tacticRecs.length ? tacticRecs.map((r, i) => {
      const cat = TYPE_INFO[r.type].category;
      const cc = catColorHex(cat);
      const tdef = TACTICS.find(x => x.type === r.type && x.name === r.name);
      const fieldRows = TACTIC_FIELDS.map(f => `<p style="font-size:10.5pt;color:#334155;margin:3pt 0;"><strong style="color:#0F172A;">${f.label}:</strong> ${escapeHTML((r[f.key] || "").trim() || "(not recorded)")}</p>`).join("");
      const ts = teamTypeFinal[r.type], s1 = ai1Scores[r.type], s2 = ai2Scores[r.type];
      return `<div style="border-left:3pt solid ${cc};padding:8pt 14pt;margin:8pt 0;background:#F8FAFC;">
        <div style="font-size:9pt;color:#64748B;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:2pt;">${String(i+1).padStart(2,"0")} · ${escapeHTML(r.type)} · <span style="color:${cc};">${cat}</span> · Team ${fmt(ts)} / ${escapeHTML(ai1Name)} ${fmt(s1)} / ${escapeHTML(ai2Name)} ${fmt(s2)}</div>
        <div style="font-size:13pt;font-weight:600;color:#0F172A;margin-bottom:2pt;">${escapeHTML(r.name)}</div>
        ${tdef ? `<div style="font-size:9.5pt;color:#64748B;font-style:italic;margin-bottom:4pt;">${escapeHTML(tdef.desc)}</div>` : ""}
        ${fieldRows}
      </div>`;
    }).join("\n") + `<p style="font-size:9.5pt;color:#64748B;margin-top:6pt;">Categories covered: ${recCats.join(", ") || "—"}${recCats.length === 1 && tacticRecs.length > 1 ? " (single-category portfolio)" : ""}. Projected strong types if adopted (team scoring): ${countStrong(teamTypeFinal)} → ${projectedStrong}.</p>`
      : `<p style="color:#64748B;font-style:italic;">No tactics recorded.</p>`;

    const qCell = (v, color) => `<td class="num" style="width:34pt;color:${color};font-weight:600;">${typeof v === "number" ? v : "—"}</td>`;
    const detailedSections = TYPES_ORDER.map(t => {
      const cat = TYPE_INFO[t].category;
      const cc = catColorHex(cat);
      const qs = QUESTIONS.filter(q => q.type === t);
      const qRows = qs.map((q, i) => {
        const key = `${t}:${i}`;
        const e1 = ai1Parsed.evidence[key], e2 = ai2Parsed.evidence[key];
        const evLines = (e1 || e2) ? `<div style="font-size:8.5pt;color:#64748B;margin-top:2pt;">${e1 ? `<span style="color:${ai1ColorHex};font-weight:600;">${escapeHTML(ai1Name)}:</span> ${escapeHTML(e1)}` : ""}${e1 && e2 ? "<br/>" : ""}${e2 ? `<span style="color:${ai2ColorHex};font-weight:600;">${escapeHTML(ai2Name)}:</span> ${escapeHTML(e2)}` : ""}</div>` : "";
        return `<tr><td style="width:34pt;"><strong>${questionCode(t, i)}</strong></td><td>${escapeHTML(q.text)}${evLines}</td>${qCell(questionScores[key], teamColorHex)}${qCell(ai1Q[key], ai1ColorHex)}${qCell(ai2Q[key], ai2ColorHex)}</tr>`;
      }).join("\n");
      const evidenceRow = typeEvidence[t]
        ? `<p style="font-size:10pt;color:#475569;margin-top:4pt;"><strong style="color:${cc};">Team evidence:</strong> <em>${escapeHTML(typeEvidence[t])}</em></p>`
        : "";
      return `<h3 style="color:${cc};">${escapeHTML(t)} <span style="font-size:10pt;color:#94A3B8;font-weight:normal;">· ${cat} · Team ${fmt(teamTypeFinal[t])} · ${escapeHTML(ai1Name)} ${fmt(ai1Scores[t])} · ${escapeHTML(ai2Name)} ${fmt(ai2Scores[t])}</span></h3>
        <table><tr><td></td><td style="font-size:8.5pt;color:#94A3B8;">Question</td><td class="num" style="font-size:8.5pt;color:${teamColorHex};">Team</td><td class="num" style="font-size:8.5pt;color:${ai1ColorHex};">AI 1</td><td class="num" style="font-size:8.5pt;color:${ai2ColorHex};">AI 2</td></tr>${qRows}</table>
        ${evidenceRow}`;
    }).join("\n");

    // ----- Triangulation section -----

    // Pull score arrays for each source; nulls excluded from stats
    const teamScoresArr = TYPES_ORDER.map(t => teamTypeScores[t].scored === teamTypeScores[t].total ? teamTypeScores[t].score : null).filter(v => v !== null);
    const ai1ScoresArr = TYPES_ORDER.map(t => ai1Scores[t]).filter(v => typeof v === "number");
    const ai2ScoresArr = TYPES_ORDER.map(t => ai2Scores[t]).filter(v => typeof v === "number");

    const stdDev = (vals) => {
      if (vals.length < 2) return null;
      const m = vals.reduce((a, b) => a + b, 0) / vals.length;
      const variance = vals.reduce((s, v) => s + (v - m) ** 2, 0) / (vals.length - 1);
      return Math.sqrt(variance);
    };

    const teamSD = stdDev(teamScoresArr);
    const ai1SD = stdDev(ai1ScoresArr);
    const ai2SD = stdDev(ai2ScoresArr);

    const avgTile = (label, total, value, sd, strong, color) => `
      <td style="width:33.3%;border-top:2pt solid ${color};padding:10pt 14pt;background:#F8FAFC;">
        <div style="font-size:9pt;color:#64748B;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;margin-bottom:3pt;">${label}</div>
        <div style="font-size:22pt;color:${color};font-family:Consolas,monospace;font-weight:600;line-height:1.1;">${fmt1(total)}<span style="font-size:11pt;color:#94A3B8;font-weight:400;">/100</span></div>
        <div style="font-size:9pt;color:#64748B;font-family:Consolas,monospace;margin-top:5pt;">Avg <strong style="color:#475569;">${fmt(value)}</strong> · SD <strong style="color:#475569;">${fmt(sd)}</strong> · Strong types <strong style="color:#475569;">${strong}</strong></div>
      </td>`;

    const avgsRow = `
      <table style="width:100%;border-collapse:separate;border-spacing:6pt 0;margin:8pt 0 14pt;">
        <tr>
          ${avgTile("Team", teamTotal, teamAvg, teamSD, countStrong(teamTypeFinal), teamColorHex)}
          ${avgTile(`${escapeHTML(ai1Name)}`, ai1Total, ai1Avg, ai1SD, countStrong(ai1Scores), ai1ColorHex)}
          ${avgTile(`${escapeHTML(ai2Name)}`, ai2Total, ai2Avg, ai2SD, countStrong(ai2Scores), ai2ColorHex)}
        </tr>
      </table>`;

    // Vertical bar chart — 10 type groups, 3 bars per group (Team / AI1 / AI2)
    const CHART_H = 150;        // pt — bar area height
    const BAR_W = 11;           // pt — width of each colored bar
    const INNER_GAP = 1;        // pt — gap between the 3 bars within a type group
    const GROUP_GAP = 7;        // pt — gap between type groups

    const SHORT_LABELS = {
      "Profit Model": "Profit<br/>Model",
      "Network": "Network",
      "Structure": "Structure",
      "Process": "Process",
      "Product Performance": "Product<br/>Performance",
      "Product System": "Product<br/>System",
      "Service": "Service",
      "Channel": "Channel",
      "Brand": "Brand",
      "Customer Engagement": "Customer<br/>Engagement",
    };

    const verticalBar = (val, color) => {
      const v = typeof val === "number" ? val : 0;
      const filled = Math.max(0, (v / 10) * CHART_H);
      const empty = CHART_H - filled;
      const labelStr = typeof val === "number" ? val.toFixed(1) : "—";
      return `<td style="vertical-align:bottom;padding:0 ${INNER_GAP}pt;">
        <div style="font-size:7pt;text-align:center;color:${color};font-family:Consolas,monospace;font-weight:600;line-height:1;margin-bottom:2pt;">${labelStr}</div>
        <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;width:${BAR_W}pt;">
          <tr><td style="height:${empty.toFixed(1)}pt;line-height:${empty.toFixed(1)}pt;font-size:1pt;mso-line-height-rule:exactly;">&nbsp;</td></tr>
          <tr><td style="height:${filled.toFixed(1)}pt;line-height:${filled.toFixed(1)}pt;font-size:1pt;background:${color};mso-line-height-rule:exactly;border-top:0.5pt solid ${color};">&nbsp;</td></tr>
        </table>
      </td>`;
    };

    const groupCells = TYPES_ORDER.map((t, idx) => {
      const team = teamTypeScores[t].scored === teamTypeScores[t].total ? teamTypeScores[t].score : null;
      const a1 = ai1Scores[t];
      const a2 = ai2Scores[t];
      const padLeft = idx === 0 ? 0 : GROUP_GAP;
      return `<td style="vertical-align:bottom;padding:0 0 0 ${padLeft}pt;">
        <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;"><tr>
          ${verticalBar(team, teamColorHex)}
          ${verticalBar(a1, ai1ColorHex)}
          ${verticalBar(a2, ai2ColorHex)}
        </tr></table>
      </td>`;
    }).join("");

    const labelCells = TYPES_ORDER.map((t, idx) => {
      const padLeft = idx === 0 ? 0 : GROUP_GAP;
      return `<td style="text-align:center;vertical-align:top;padding:5pt ${padLeft / 2}pt 0 ${padLeft / 2}pt;font-size:7.5pt;color:#475569;line-height:1.2;">${SHORT_LABELS[t]}</td>`;
    }).join("");

    const legendSwatch = (color, name) => `<span style="display:inline-block;margin-right:14pt;font-size:9pt;color:#475569;"><span style="display:inline-block;width:9pt;height:9pt;background:${color};vertical-align:middle;margin-right:4pt;border:0.5pt solid ${color};"></span>${escapeHTML(name)}</span>`;

    const chartTable = `
      <div style="margin:6pt 0 6pt 0;">
        <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin:0 auto;">
          <tr style="height:${CHART_H + 12}pt;">${groupCells}</tr>
          <tr>${labelCells}</tr>
        </table>
        <div style="text-align:center;margin-top:6pt;">
          ${legendSwatch(teamColorHex, "Team")}
          ${legendSwatch(ai1ColorHex, ai1Name)}
          ${legendSwatch(ai2ColorHex, ai2Name)}
        </div>
      </div>`;

    // Pattern analysis — only types where all three sources have scored
    const consensusItems = triangulation.filter(i => i.spread <= 1.5).sort((a, b) => b.team - a.team).slice(0, 4);
    const teamVsAIsItems = [...triangulation].sort((a, b) => Math.abs(b.teamVsAI) - Math.abs(a.teamVsAI)).slice(0, 3);
    const aisDisagreeItems = [...triangulation].sort((a, b) => b.aiSpread - a.aiSpread).slice(0, 3);

    const patternItem = (item, note) => `
      <div style="padding:5pt 0;border-bottom:0.25pt solid #E2E8F0;">
        <div style="font-size:10pt;font-weight:600;color:#0F172A;">${escapeHTML(item.type)}</div>
        <div style="font-size:9pt;font-family:Consolas,monospace;color:#64748B;margin-top:2pt;">
          Team:&nbsp;<strong style="color:${teamColorHex};">${item.team.toFixed(1)}</strong>
          &nbsp;·&nbsp;${escapeHTML(ai1Name)}:&nbsp;<strong style="color:${ai1ColorHex};">${item.ai1.toFixed(1)}</strong>
          &nbsp;·&nbsp;${escapeHTML(ai2Name)}:&nbsp;<strong style="color:${ai2ColorHex};">${item.ai2.toFixed(1)}</strong>
          ${note ? `&nbsp;&nbsp;<span style="color:#475569;font-style:italic;">— ${escapeHTML(note)}</span>` : ""}
        </div>
        ${typeEvidence[item.type] ? `<div style="font-size:9pt;font-style:italic;color:#475569;margin-top:3pt;">"${escapeHTML(typeEvidence[item.type])}"</div>` : ""}
      </div>`;

    const patternBlock = (title, subtitle, color, items, noteFn) => `
      <div style="padding:8pt 12pt;border:0.5pt solid #E2E8F0;border-left:2pt solid ${color};background:#F8FAFC;margin:6pt 0;">
        <div style="display:block;margin-bottom:2pt;">
          <span style="font-size:10pt;font-weight:600;color:${color};letter-spacing:0.04em;text-transform:uppercase;">${title}</span>
          <span style="font-size:9pt;color:#94A3B8;margin-left:6pt;">— ${subtitle}</span>
        </div>
        ${items.length === 0
          ? `<div style="font-size:9pt;color:#94A3B8;font-style:italic;padding:3pt 0;">None.</div>`
          : items.map(item => patternItem(item, noteFn ? noteFn(item) : null)).join("")}
      </div>`;

    const patternsTable = `
      ${patternBlock("Consensus", "All three within 1.5 points", "#059669", consensusItems, null)}
      ${patternBlock("Team vs. AIs", "Team disagrees with AI consensus", "#EA580C", teamVsAIsItems, c => `Team ${c.teamVsAI > 0 ? "higher" : "lower"} by ${Math.abs(c.teamVsAI).toFixed(1)}`)}
      ${patternBlock("AIs Disagree", `${ai1Name} vs ${ai2Name}`, "#7C3AED", aisDisagreeItems, c => `AI spread: ${c.aiSpread.toFixed(1)}`)}`;

    const qGapTeam = [...questionGaps].filter(g => Math.abs(g.teamVsAI) >= 1.5).sort((a, b) => Math.abs(b.teamVsAI) - Math.abs(a.teamVsAI)).slice(0, 6);
    const qGapAI = [...questionGaps].filter(g => g.aiSpread >= 2).sort((a, b) => b.aiSpread - a.aiSpread).slice(0, 4);
    const qGapRow = (g, note) => `<tr>
        <td style="width:34pt;vertical-align:top;"><strong>${g.code}</strong></td>
        <td style="vertical-align:top;">${escapeHTML(g.text)}
          <div style="font-size:8.5pt;color:#64748B;margin-top:2pt;">${note}</div>
          ${g.ev1 ? `<div style="font-size:8.5pt;color:#64748B;"><span style="color:${ai1ColorHex};font-weight:600;">${escapeHTML(ai1Name)}:</span> ${escapeHTML(g.ev1)}</div>` : ""}
          ${g.ev2 ? `<div style="font-size:8.5pt;color:#64748B;"><span style="color:${ai2ColorHex};font-weight:600;">${escapeHTML(ai2Name)}:</span> ${escapeHTML(g.ev2)}</div>` : ""}
        </td>
        ${qCell(g.team, teamColorHex)}${qCell(g.ai1, ai1ColorHex)}${qCell(g.ai2, ai2ColorHex)}
      </tr>`;
    const qHeader = `<tr><td></td><td style="font-size:8.5pt;color:#94A3B8;">Question</td><td class="num" style="font-size:8.5pt;color:${teamColorHex};">Team</td><td class="num" style="font-size:8.5pt;color:${ai1ColorHex};">AI 1</td><td class="num" style="font-size:8.5pt;color:${ai2ColorHex};">AI 2</td></tr>`;
    const questionSection = questionGaps.length ? `
<h3 style="font-size:11pt;color:#0F172A;">Question-Level Disagreements</h3>
<p style="font-size:9.5pt;color:#64748B;margin:0 0 4pt;">All three sources answered the same ${NQ} questions on the same 0–3 scale, so gaps can be traced to specific questions.</p>
<p style="font-size:10pt;font-weight:600;color:${teamColorHex};margin:8pt 0 2pt;">Team vs. AIs (gap ≥ 1.5 points)</p>
${qGapTeam.length ? `<table>${qHeader}${qGapTeam.map(g => qGapRow(g, `Team ${g.teamVsAI > 0 ? "higher" : "lower"} than the AI average by ${Math.abs(g.teamVsAI).toFixed(1)}`)).join("")}</table>` : `<p style="font-size:9pt;color:#94A3B8;font-style:italic;">None.</p>`}
<p style="font-size:10pt;font-weight:600;color:${ai2ColorHex};margin:8pt 0 2pt;">AIs disagree (spread ≥ 2 points)</p>
${qGapAI.length ? `<table>${qHeader}${qGapAI.map(g => qGapRow(g, `AI spread ${g.aiSpread}`)).join("")}</table>` : `<p style="font-size:9pt;color:#94A3B8;font-style:italic;">None.</p>`}
` : "";

    const triangulationSection = triangulation.length > 0 ? `
<h2>Triangulation</h2>
<p style="font-size:10pt;color:#64748B;margin:0 0 4pt;">Three perspectives on ${escapeHTML(companyName || "the company")}'s innovation profile — the team's collective scoring, ${escapeHTML(ai1Name)}'s independent assessment, and ${escapeHTML(ai2Name)}'s.</p>

<h3 style="margin-top:14pt;font-size:11pt;color:#0F172A;">Total Innovation Score by Source · 0–100</h3>
${avgsRow}

<h3 style="font-size:11pt;color:#0F172A;">Score by Type · Three-Way Comparison</h3>
${chartTable}

<h3 style="font-size:11pt;color:#0F172A;page-break-after:avoid;mso-page-break-after:avoid;">Pattern Analysis</h3>
<div style="page-break-inside:avoid;mso-page-break-inside:avoid;">
${patternsTable}
</div>
${questionSection}
` : `
<h2>Triangulation</h2>
<p style="font-size:10pt;color:#64748B;font-style:italic;">Triangulation requires complete scoring from the team and both AI analysts. This section is empty because at least one source did not score every type.</p>
`;

    return `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head>
<meta charset='utf-8'>
<title>${escapeHTML(companyName || "Innovation Analysis")} — Innovation Workshop</title>

${triangulationSection}

${detailedSections}

</div>

  };

  const buildPlainText = () => {
    const f2 = (v) => typeof v === "number" ? v.toFixed(2) : "—";
    const f1 = (v) => typeof v === "number" ? v.toFixed(1) : "—";
    const n1 = (ai1Name || "AI 1").slice(0, 16), n2 = (ai2Name || "AI 2").slice(0, 16);
    const lines = [];
    lines.push(`INNOVATION WORKSHOP ${APP_VERSION} — TEAM SUMMARY`);
    lines.push(`Company: ${companyName || "(unnamed)"}`);
    if (companyContext.trim()) lines.push(`Scope: ${companyContext.trim()}`);
    if (teamName) lines.push(`Team: ${teamName}`);
    lines.push(`AI models: ${ai1Name || "—"} · ${ai2Name || "—"}`);
    lines.push(`Generated: ${new Date().toLocaleString()}`);
    lines.push("");
    lines.push(`TYPE SCORES (0-10, rolled up from ${NQ} questions scored 0-3 by every source)`);
    lines.push(`${"Type".padEnd(24)}${"Team".padStart(8)}${n1.padStart(18)}${n2.padStart(18)}`);
    lines.push("-".repeat(68));
    TYPES_ORDER.forEach(t => {
      lines.push(`${t.padEnd(24)}${f2(teamTypeFinal[t]).padStart(8)}${f2(ai1Scores[t]).padStart(18)}${f2(ai2Scores[t]).padStart(18)}`);
    });
    lines.push("-".repeat(68));
    lines.push(`${"TOTAL (0-100)".padEnd(24)}${f1(teamTotal).padStart(8)}${f1(ai1Total).padStart(18)}${f1(ai2Total).padStart(18)}`);
    lines.push(`${`Strong types (>= ${STRONG_THRESHOLD})`.padEnd(24)}${String(countStrong(teamTypeFinal)).padStart(8)}${String(countStrong(ai1Scores)).padStart(18)}${String(countStrong(ai2Scores)).padStart(18)}`);
    lines.push("");
    lines.push(`TACTIC RECOMMENDATIONS`);
    if (!tacticRecs.length) lines.push("(none recorded)");
    tacticRecs.forEach((r, i) => {
      lines.push(`\n${i+1}. ${r.name} (${r.type} · ${TYPE_INFO[r.type].category})`);
      TACTIC_FIELDS.forEach(fd => lines.push(`   ${fd.label}: ${(r[fd.key] || "").trim() || "(not recorded)"}`));
    });
    if (tacticRecs.length) lines.push(`\nProjected strong types if adopted (team scoring): ${countStrong(teamTypeFinal)} -> ${projectedStrong}`);
    lines.push("");
    lines.push(`PER-QUESTION SCORES (Team / ${n1} / ${n2})`);
    TYPES_ORDER.forEach(t => {
      lines.push(`\n${t}:`);
      QUESTIONS.filter(q => q.type === t).forEach((q, i) => {
        const key = `${t}:${i}`;
        const v = (x) => typeof x === "number" ? x : "—";
        lines.push(`  ${questionCode(t, i).padEnd(4)} [${v(questionScores[key])} / ${v(ai1Q[key])} / ${v(ai2Q[key])}]  ${q.text}`);
        if (ai1Parsed.evidence[key]) lines.push(`        ${n1}: ${ai1Parsed.evidence[key]}`);
        if (ai2Parsed.evidence[key]) lines.push(`        ${n2}: ${ai2Parsed.evidence[key]}`);
      });
      if (typeEvidence[t]) lines.push(`  Team evidence: ${typeEvidence[t]}`);
    });
    lines.push("");
    lines.push(`AI SUMMARIES`);
    lines.push(`${ai1Name || "AI 1"}: ${ai1Parsed.summary || "(none)"}`);
    lines.push(`${ai2Name || "AI 2"}: ${ai2Parsed.summary || "(none)"}`);
    return lines.join("\n");
  };

  const downloadSummary = () => {
    setSummaryCopied(false);
    setSummaryOpen(true);

  const safeName = () => (companyName || "company").replace(/[^a-z0-9]/gi, "_").toLowerCase();

  const downloadAsWord = () => {
    try {
      const html = buildWordHTML();
      const blob = new Blob(["\ufeff", html], { type: "application/msword;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `innovation_workshop_${safeName()}.doc`;
      a.rel = "noopener";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        if (document.body.contains(a)) document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    } catch (e) {}
  };

  const downloadAsText = () => {
    try {
      const blob = new Blob([buildPlainText()], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

  };

      setTimeout(() => setSummaryCopied(false), 2000);

      setSummaryCopied(false);
    }
  };

  // ============================================================

  return (
    <div style={{

      {/* Header */}
      <header style={{
