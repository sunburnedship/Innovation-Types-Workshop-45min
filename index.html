}

// ============================================================
// PHASE VI — TACTICS
// ============================================================

const MAX_TACTICS = 3;

function PhaseTactics({ companyName, teamTypeFinal, ai1Scores, ai2Scores, ai1Name, ai2Name, projectedStrong, tacticRecs, setTacticRecs, onContinue, onBack }) {
  // Three-source mean per type drives the ordering (falls back to whatever sources exist)
  const typeStats = useMemo(() => {
    const out = {};
    TYPES_ORDER.forEach(t => {
      const vals = [teamTypeFinal[t], ai1Scores[t], ai2Scores[t]].filter(v => typeof v === "number");
      out[t] = { team: teamTypeFinal[t], ai1: ai1Scores[t], ai2: ai2Scores[t], mean: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0 };
    });
    return out;
  }, [teamTypeFinal, ai1Scores, ai2Scores]);
  const sortedTypes = useMemo(() => [...TYPES_ORDER].sort((a, b) => typeStats[a].mean - typeStats[b].mean), [typeStats]);

  const [openType, setOpenType] = useState(sortedTypes[0] || null);
  const fieldRefs = useRef({});

  const isSelected = (type, name) => tacticRecs.some(r => r.type === type && r.name === name);
  const addTactic = (type, name) => {
    if (tacticRecs.length >= MAX_TACTICS || isSelected(type, name)) return;
    setTacticRecs(prev => [...prev, normalizeTactic({ type, name })]);
  };
  const removeTactic = (type, name) => setTacticRecs(prev => prev.filter(r => !(r.type === type && r.name === name)));
  const updateField = (type, name, field, val) => setTacticRecs(prev => prev.map(r =>
    (r.type === type && r.name === name) ? { ...r, [field]: val } : r
  ));

  const canContinue = tacticRecs.length >= 2 && tacticRecs.every(tacticComplete);
  const strongNow = countStrong(teamTypeFinal);
  const coveredCats = new Set(tacticRecs.map(r => TYPE_INFO[r.type].category));
  const singleCategory = tacticRecs.length >= 2 && coveredCats.size === 1;
  const isStrongType = (t) => typeof typeStats[t].team === "number" && typeStats[t].team >= STRONG_THRESHOLD;

  const handleContinue = () => {
    if (canContinue) { onContinue(); return; }
    for (const r of tacticRecs) {
      const f = TACTIC_FIELDS.find(fd => !(r[fd.key] || "").trim());
      if (f) {
        const el = fieldRefs.current[`${r.type}:${r.name}:${f.key}`];
        if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); setTimeout(() => el.focus(), 250); }
        return;
      }
    }
  };

  const fmtS = (v) => typeof v === "number" ? v.toFixed(1) : "—";

  return (
    <div>
      <PhaseHeader num="06" title="Tactic Recommendations" subtitle={`Doblin's library of ${TACTICS.length} tactics — pick 2–3 ${companyName} should adopt next, and make the case for each.`} />

      <div style={{ marginTop: "1.25rem", marginBottom: "1.5rem", padding: "0.85rem 1.1rem", backgroundColor: C.accentDim, border: `1px solid ${C.accent}30`, borderRadius: "10px", display: "flex", gap: "0.75rem", alignItems: "flex-start" }}>
        <Layers size={16} color={C.accentBright} style={{ flexShrink: 0, marginTop: "2px" }} />
        <p style={{ margin: 0, fontSize: "0.9rem", lineHeight: 1.55, color: C.text }}>
          Types are sorted by the <strong style={{ color: C.accentBright }}>average of all three sources, lowest first</strong> — these are the likeliest opportunities. Keeley's research says breakthroughs come from <strong>combining</strong> types, so aim for tactics in more than one category. Each pick needs three short answers: the gap, the evidence, and what adoption would take.
        </p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1.4fr) minmax(0, 1fr)", gap: "1.5rem", alignItems: "start" }}>
        {/* LEFT: tactic browser */}
        <div style={{ display: "flex", flexDirection: "column", gap: "0.6rem" }}>
          {sortedTypes.map(typeName => {
            const info = TYPE_INFO[typeName];
            const catColor = CATEGORY_COLORS[info.category];
            const tactics = TACTICS.filter(t => t.type === typeName);
            const st = typeStats[typeName];
            const isOpen = openType === typeName;
            const opportunity = st.mean < 5;
            const strength = isStrongType(typeName);
            return (
              <div key={typeName} style={{
                backgroundColor: C.surface,
                border: `1px solid ${isOpen ? `${catColor}50` : C.border}`,
                borderRadius: "10px",
                overflow: "hidden",
                transition: "all 0.15s",
              }}>
                <button
                  onClick={() => setOpenType(isOpen ? null : typeName)}
                  style={{
                    width: "100%", display: "grid",
                    gridTemplateColumns: "auto 1fr auto auto",
                    alignItems: "center", gap: "0.85rem",
                    padding: "0.75rem 1rem",
                    backgroundColor: "transparent", border: "none",
                    cursor: "pointer", textAlign: "left",
                    color: C.text,
                  }}
                >
                  <div style={{ display: "flex", alignItems: "center", gap: "0.5rem" }}>
                    <div style={{ width: "8px", height: "8px", borderRadius: "999px", backgroundColor: catColor, boxShadow: `0 0 6px ${catColor}80` }} />
                    <span className="mono" style={{ fontSize: "9px", color: catColor, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase" }}>{info.category}</span>
                  </div>
                  <h4 style={{ fontSize: "1rem", fontWeight: 600, margin: 0, color: C.text, display: "flex", alignItems: "center", gap: "0.5rem", flexWrap: "wrap" }}>
                    {typeName}
                    {opportunity && <Badge color={C.warning}>opportunity</Badge>}
                    {strength && <Badge color={C.success}>strength</Badge>}
                  </h4>
                  <span className="mono" style={{ fontSize: "10px", color: C.textDim, whiteSpace: "nowrap" }}>
                    T <strong style={{ color: C.experience }}>{fmtS(st.team)}</strong>{" "}
                    A1 <strong style={{ color: C.offering }}>{fmtS(st.ai1)}</strong>{" "}
                    A2 <strong style={{ color: C.config }}>{fmtS(st.ai2)}</strong>
                    <span style={{ marginLeft: "0.5rem", opacity: 0.7 }}>· {tactics.length}</span>
                  </span>
                  {isOpen ? <ChevronUp size={16} color={C.textDim} /> : <ChevronDown size={16} color={C.textDim} />}
                </button>

                {isOpen && (
                  <div style={{ padding: "0 1rem 0.85rem", display: "flex", flexDirection: "column", gap: "0.4rem" }}>
                    {strength && (
                      <div style={{ fontSize: "0.78rem", color: C.success, padding: "0.2rem 0 0.3rem" }}>
                        Already a strength by your scoring. A tactic here doubles down — make sure that beats attacking a gap.
                      </div>
                    )}
                    {tactics.map(t => {
                      const selected = isSelected(typeName, t.name);
                      const disabled = !selected && tacticRecs.length >= MAX_TACTICS;
                      return (
                        <div key={t.name} style={{
                          display: "grid",
                          gridTemplateColumns: "auto 1fr auto",
                          gap: "0.7rem",
                          alignItems: "center",
                          padding: "0.5rem 0.7rem",
                          backgroundColor: selected ? `${catColor}15` : C.surface2,
                          border: `1px solid ${selected ? `${catColor}40` : C.border}`,
                          borderRadius: "8px",
                        }}>
                          <span className="mono" style={{ fontSize: "10px", color: catColor, fontWeight: 700, minWidth: "110px" }}>
                            {t.name}
                          </span>
                          <p style={{ fontSize: "0.83rem", margin: 0, lineHeight: 1.4, color: C.textDim }}>
                            {t.desc}
                          </p>
                          <button
                            onClick={() => selected ? removeTactic(typeName, t.name) : addTactic(typeName, t.name)}
                            disabled={disabled}
                            className="mono"
                            style={{
                              padding: "0.3rem 0.55rem",
                              border: "none",
                              backgroundColor: selected ? C.danger : disabled ? C.surface3 : C.accent,
                              color: disabled ? C.textMuted : "white",
                              borderRadius: "5px",
                              fontSize: "10px", fontWeight: 600,
                              letterSpacing: "0.04em", textTransform: "uppercase",
                              cursor: disabled ? "not-allowed" : "pointer",
                              display: "flex", alignItems: "center", gap: "0.25rem",
                              transition: "all 0.15s",
                            }}
                          >
                            {selected ? <><XIcon size={11} /> Remove</> : <><Plus size={11} /> Add</>}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* RIGHT: selected tactics + structured case */}
        <aside style={{ position: "sticky", top: "5rem", alignSelf: "start", maxHeight: "calc(100vh - 6rem)", overflowY: "auto" }}>
          <Card style={{ borderColor: tacticRecs.length > 0 ? `${C.accent}40` : C.border }}>
            <div style={{ display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: "0.4rem" }}>
              <Target size={14} color={C.accentBright} />
              <span className="label" style={{ color: C.accentBright }}>Recommendations · Make the Case</span>
            </div>
            <h3 style={{ fontSize: "1.15rem", fontWeight: 600, margin: "0 0 0.85rem", color: C.text }}>
              {tacticRecs.length} of {MAX_TACTICS} selected
            </h3>

            {/* Portfolio checks */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0.5rem", marginBottom: "0.85rem" }}>
              <div style={{ padding: "0.55rem 0.7rem", backgroundColor: C.surface2, border: `1px solid ${C.border}`, borderRadius: "8px" }}>
                <div className="label" style={{ fontSize: "9px" }}>Path to five</div>
                <div className="mono" style={{ fontSize: "1rem", fontWeight: 700, marginTop: "0.2rem", color: projectedStrong >= 5 ? C.success : C.text }}>
                  {strongNow} <span style={{ color: C.textMuted, fontWeight: 400 }}>→</span> {projectedStrong}
                  <span style={{ fontSize: "10px", color: C.textMuted, fontWeight: 400 }}> strong types</span>
                </div>
              </div>
              <div style={{ padding: "0.55rem 0.7rem", backgroundColor: C.surface2, border: `1px solid ${C.border}`, borderRadius: "8px" }}>
                <div className="label" style={{ fontSize: "9px" }}>Categories covered</div>
                <div style={{ display: "flex", gap: "0.3rem", marginTop: "0.3rem", flexWrap: "wrap" }}>
                  {CATEGORIES.map(cat => {
                    const on = coveredCats.has(cat);
                    const col = CATEGORY_COLORS[cat];
                    return <span key={cat} className="mono" title={cat} style={{ fontSize: "9px", fontWeight: 700, padding: "0.15rem 0.4rem", borderRadius: "4px", border: `1px solid ${on ? col : C.border}`, color: on ? col : C.textMuted, backgroundColor: on ? `${col}20` : "transparent" }}>{cat}</span>;
                  })}
                </div>
              </div>
            </div>

            {singleCategory && (
              <div style={{ fontSize: "0.8rem", lineHeight: 1.45, color: C.text, padding: "0.6rem 0.75rem", marginBottom: "0.85rem", backgroundColor: `${C.warning}12`, border: `1px solid ${C.warning}40`, borderRadius: "8px" }}>
                <strong style={{ color: C.warning }}>All picks are {[...coveredCats][0]} tactics.</strong> Competitors copy single-category moves quickly. Consider swapping one for a tactic in another category, or explain below why concentrating here is right.
              </div>
            )}

            {tacticRecs.length === 0 && (
              <div style={{ fontSize: "0.88rem", lineHeight: 1.5, color: C.textDim, padding: "0.5rem 0 1rem", fontStyle: "italic" }}>
                Browse types on the left and click <span className="mono" style={{ fontStyle: "normal", color: C.accentBright }}>+ Add</span> to select tactics. Pick 2–3 total.
              </div>
            )}

            <div style={{ display: "flex", flexDirection: "column", gap: "0.85rem" }}>
              {tacticRecs.map((r, idx) => {
                const info = TYPE_INFO[r.type];
                const catColor = CATEGORY_COLORS[info.category];
                const st = typeStats[r.type];
                return (
                  <div key={`${r.type}:${r.name}`} style={{
                    backgroundColor: C.surface2,
                    border: `1px solid ${catColor}30`,
                    borderLeft: `3px solid ${catColor}`,
                    borderRadius: "8px",
                    padding: "0.75rem 0.9rem",
                  }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "0.5rem" }}>
                      <div>
                        <div className="mono" style={{ fontSize: "9px", color: catColor, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700, marginBottom: "0.15rem" }}>
                          {String(idx + 1).padStart(2, "0")} · {r.type} · T {fmtS(st.team)} / A1 {fmtS(st.ai1)} / A2 {fmtS(st.ai2)}
                        </div>
                        <div style={{ fontSize: "0.98rem", fontWeight: 600, color: C.text }}>
                          {r.name}
                        </div>
                        {isStrongType(r.type) && <div style={{ fontSize: "0.72rem", color: C.success, marginTop: "0.15rem" }}>Doubles down on an existing strength</div>}
                      </div>
                      <button
                        onClick={() => removeTactic(r.type, r.name)}
                        aria-label={`Remove ${r.name}`}
                        style={{ background: "none", border: "none", cursor: "pointer", color: C.textDim, padding: "0.2rem", borderRadius: "5px" }}
                        onMouseEnter={(e) => { e.currentTarget.style.color = C.danger; }}
                        onMouseLeave={(e) => { e.currentTarget.style.color = C.textDim; }}
                      >
                        <XIcon size={13} />
                      </button>
                    </div>
                    {TACTIC_FIELDS.map(f => {
                      const filled = (r[f.key] || "").trim().length > 0;
                      return (
                        <div key={f.key} style={{ marginTop: "0.45rem" }}>
                          <div className="label" style={{ fontSize: "9px", marginBottom: "0.2rem", color: filled ? C.textDim : C.warning }}>
                            {f.label}{!filled && " · required"}
                          </div>
                          <textarea
                            ref={(el) => { fieldRefs.current[`${r.type}:${r.name}:${f.key}`] = el; }}
                            value={r[f.key] || ""}
                            onChange={(e) => updateField(r.type, r.name, f.key, e.target.value)}
                            placeholder={f.placeholder}
                            rows={2}
                            className="iw-input"
                            style={{ fontSize: "0.8rem", padding: "0.45rem 0.6rem" }}
                          />
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </Card>
        </aside>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", marginTop: "2rem" }}>
        <SecondaryButton onClick={onBack}><ChevronLeft size={15} /> Back</SecondaryButton>
        <PrimaryButton onClick={handleContinue} disabled={tacticRecs.length < 2}>
          {canContinue
            ? "Take-away"
            : tacticRecs.length < 2
              ? `Pick at least 2 tactics (${tacticRecs.length}/2)`
              : "Complete each tactic's case →"}
          <ChevronRight size={15} />
        </PrimaryButton>
      </div>
    </div>
  );
}

function Badge({ color, children }) {
  return (
    <span style={{ padding: "0.1rem 0.4rem", backgroundColor: `${color}20`, color, borderRadius: "4px", fontSize: "9px", fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase" }}>
      {children}
    </span>
  );
}

// ============================================================
// PHASE VII — TAKEAWAY
// ============================================================

function PhaseTakeaway({ companyName, teamName, teamTotal, ai1Total, ai2Total, teamTypeFinal, ai1Scores, ai2Scores, projectedStrong, ai1Name, ai2Name, tacticRecs, downloadSummary, onBack }) {
  const fiveTypeRule = {
    teamHighs: countStrong(teamTypeFinal),
    ai1Highs: countStrong(ai1Scores),
    ai2Highs: countStrong(ai2Scores),
  };

  const maxHighs = Math.max(fiveTypeRule.teamHighs, fiveTypeRule.ai1Highs, fiveTypeRule.ai2Highs);

  return (
    <div style={{ maxWidth: "920px", margin: "0 auto" }}>
      <PhaseHeader num="07" title="The Take-Away" />

      <p style={{ fontSize: "1.1rem", lineHeight: 1.6, marginTop: "1.25rem", color: C.text }}>
        Your team's analysis of <strong style={{ color: C.accentBright }}>{companyName || "the company"}</strong>{teamName && <> from <strong style={{ color: C.accentBright }}>{teamName}</strong></>} is complete.
      </p>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "0.85rem", marginTop: "1.25rem" }}>
        {[["Team", teamTotal, C.experience], [ai1Name, ai1Total, C.offering], [ai2Name, ai2Total, C.config]].map(([lbl, v, col]) => (
          <div key={lbl} style={{ backgroundColor: C.surface, border: `1px solid ${C.border}`, borderTop: `2px solid ${col}`, borderRadius: "10px", padding: "0.75rem 1rem" }}>
            <div className="label">{lbl} · Total</div>
            <div className="mono" style={{ fontSize: "1.6rem", fontWeight: 600, color: col, marginTop: "0.2rem" }}>
              {typeof v === "number" ? v.toFixed(1) : "—"}<span style={{ fontSize: "11px", color: C.textMuted }}>/100</span>
            </div>
          </div>
        ))}
      </div>

      <Card style={{ marginTop: "1.5rem", borderColor: `${C.experience}40`, backgroundColor: `${C.experience}08` }}>
        <div style={{ display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: "0.6rem" }}>
          <Zap size={14} color={C.experience} />
          <span className="label" style={{ color: C.experience }}>Reflection · Five-Type Threshold</span>
        </div>
        <p style={{ fontSize: "0.98rem", lineHeight: 1.65, margin: 0, color: C.text }}>
          Keeley's research found companies innovating on <strong>five or more types simultaneously</strong> dramatically outperform single-type innovators. By the team's scoring, <strong>{companyName}</strong> innovates strongly (type score ≥ {STRONG_THRESHOLD}) on <strong style={{ color: C.experience }}>{fiveTypeRule.teamHighs}</strong> {fiveTypeRule.teamHighs === 1 ? "type" : "types"}; by {ai1Name}, on <strong style={{ color: C.offering }}>{fiveTypeRule.ai1Highs}</strong>; by {ai2Name}, on <strong style={{ color: C.config }}>{fiveTypeRule.ai2Highs}</strong>.{" "}
          {maxHighs >= 5
            ? "By at least one measure, this company clears the threshold — the framework predicts durable advantage."
            : "None of the three observers see five-or-more strong types. The company has clear room to broaden its innovation portfolio."}{" "}
          {tacticRecs.length > 0 && <>If your recommended tactics succeed, the team's count would rise to <strong style={{ color: C.experience }}>{projectedStrong}</strong>{projectedStrong >= 5 ? " — across the threshold." : "."}</>}
        </p>
      </Card>

      <Card style={{ marginTop: "1rem", borderColor: `${C.offering}40`, backgroundColor: `${C.offering}08` }}>
        <div style={{ display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: "0.6rem" }}>
          <Layers size={14} color={C.offering} />
          <span className="label" style={{ color: C.offering }}>Reflection · Triangulation, not Oracle</span>
        </div>
        <p style={{ fontSize: "0.98rem", lineHeight: 1.65, margin: 0, color: C.text }}>
          You consulted two different AI models, and they did not give identical scores. That spread is itself information: the framework has genuine ambiguity, the models have different training and access, and the team brings local context neither can match. The right way to use AI as an analytical assistant is the way you used it — as one voice among several, valued precisely because it disagrees.
        </p>
      </Card>

      <Card style={{ marginTop: "1rem", borderColor: `${C.config}40`, backgroundColor: `${C.config}08` }}>
        <div style={{ display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: "0.6rem" }}>
          <Target size={14} color={C.config} />
          <span className="label" style={{ color: C.config }}>Reflection · From Diagnosis to Recommendation</span>
        </div>
        <p style={{ fontSize: "0.98rem", lineHeight: 1.65, margin: 0, color: C.text }}>
          Diagnosis is the easy half. Recommendation requires you to commit. Your team selected <strong>{tacticRecs.length} {tacticRecs.length === 1 ? "tactic" : "tactics"}</strong>{tacticRecs.length > 0 && <>: {tacticRecs.map((r, i) => (
            <React.Fragment key={`${r.type}:${r.name}`}>
              {i > 0 && ", "}
              <strong style={{ color: CATEGORY_COLORS[TYPE_INFO[r.type].category] }}>{r.name}</strong>
            </React.Fragment>
          ))}</>}. Each carries an opportunity cost — what would adoption require this company to <em>stop</em> doing?
        </p>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1rem", marginTop: "2rem" }}>
        <PrimaryButton onClick={downloadSummary} style={{ padding: "1rem 1.25rem", justifyContent: "center" }}>
          <Download size={15} /> Export workshop results
        </PrimaryButton>
        <SecondaryButton onClick={onBack} style={{ padding: "1rem 1.25rem", justifyContent: "center" }}>
          <ChevronLeft size={15} /> Revisit tactics
        </SecondaryButton>
      </div>

      <div style={{ marginTop: "3rem", textAlign: "center", padding: "1.5rem 0", borderTop: `1px solid ${C.border}` }}>
        <p style={{ fontSize: "1.05rem", fontStyle: "italic", color: C.textDim, margin: 0, lineHeight: 1.5 }}>
          "Innovation is the elaboration of new combinations of existing knowledge."
        </p>
        <p className="mono" style={{ fontSize: "10px", color: C.textMuted, marginTop: "0.4rem", letterSpacing: "0.1em" }}>
          — JOSEPH SCHUMPETER, 1942
        </p>
      </div>
    </div>
  );
}

// ============================================================
// SHARED UI
// ============================================================

function PhaseHeader({ num, title, subtitle }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: "0.4rem" }}>
        <div style={{ display: "flex", alignItems: "center", gap: "0.4rem", padding: "0.25rem 0.65rem", backgroundColor: C.accentDim, border: `1px solid ${C.accent}40`, borderRadius: "999px" }}>
          <span className="mono" style={{ fontSize: "10px", color: C.accentBright, fontWeight: 600, letterSpacing: "0.08em" }}>PHASE {num}</span>
        </div>
      </div>
      <h2 style={{ fontSize: "1.85rem", fontWeight: 600, margin: 0, color: C.text, letterSpacing: "-0.02em", lineHeight: 1.15 }}>
        {title}
      </h2>
      {subtitle && (
        <p style={{ margin: "0.4rem 0 0", fontSize: "0.95rem", color: C.textDim, lineHeight: 1.55 }}>
          {subtitle}
        </p>
      )}
    </div>
  );
}

function StepLabel({ num, title }) {
  return (
    <div style={{ marginBottom: "0.65rem" }}>
      <div style={{ display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: "0.35rem" }}>
        <span style={{ padding: "0.2rem 0.5rem", backgroundColor: C.accent, color: "white", borderRadius: "5px", fontSize: "10px", fontWeight: 700, letterSpacing: "0.08em" }} className="mono">
          STEP {num}
        </span>
      </div>
      <h3 style={{ fontSize: "1.1rem", fontWeight: 600, margin: 0, color: C.text }}>
        {title}
      </h3>
    </div>
  );
}

function PrimaryButton({ children, onClick, disabled, style = {} }) {
  return (
    <button
      onClick={onClick} disabled={disabled} className="mono"
      style={{
        padding: "0.7rem 1.2rem",
        backgroundColor: disabled ? "rgba(59,130,246,0.25)" : C.accent,
        color: "white",
        border: "none",
        borderRadius: "8px",
        fontSize: "12px",
        fontWeight: 600,
        letterSpacing: "0.04em",
        textTransform: "uppercase",
        cursor: disabled ? "not-allowed" : "pointer",
        display: "inline-flex", alignItems: "center", gap: "0.5rem",
        transition: "all 0.15s",
        boxShadow: disabled ? "none" : `0 1px 2px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05) inset`,
        ...style,
      }}
      onMouseEnter={(e) => { if (!disabled) e.currentTarget.style.backgroundColor = C.accentBright; }}
      onMouseLeave={(e) => { if (!disabled) e.currentTarget.style.backgroundColor = C.accent; }}
    >
      {children}
    </button>
  );
}

function SecondaryButton({ children, onClick, style = {} }) {
  return (
    <button
      onClick={onClick} className="mono"
      style={{
        padding: "0.7rem 1.2rem",
        backgroundColor: C.surface2,
        color: C.text,
        border: `1px solid ${C.borderHi}`,
        borderRadius: "8px",
        fontSize: "12px",
        fontWeight: 500,
        letterSpacing: "0.04em",
        textTransform: "uppercase",
        cursor: "pointer",
        display: "inline-flex", alignItems: "center", gap: "0.5rem",
        transition: "all 0.15s",
        ...style,
      }}
      onMouseEnter={(e) => { e.currentTarget.style.backgroundColor = C.surface3; }}
      onMouseLeave={(e) => { e.currentTarget.style.backgroundColor = C.surface2; }}
    >
      {children}
    </button>
  );
}

function Card({ children, subtle, style = {} }) {
  return (
    <div style={{
      backgroundColor: subtle ? "transparent" : C.surface,
      border: `1px solid ${C.border}`,
      borderRadius: "12px",
      padding: "1.5rem",
      ...style,
    }}>
      {children}
    </div>
  );
}

function Field({ label, hint, required, children }) {
  return (
    <div style={{ marginBottom: "1.1rem" }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: "0.5rem", marginBottom: "0.4rem" }}>
        <span className="label">{label}</span>
        {required && <span style={{ fontSize: "10px", color: C.danger }}>required</span>}
        {hint && <span className="mono" style={{ fontSize: "10px", color: C.textMuted }}>{hint}</span>}
      </div>
      {children}
    </div>
  );
}

function TotalPill({ value, provisional, label = "Total" }) {
  return (
    <div title={provisional ? "Running total — final once every question is scored" : "Total Innovation Score (sum of the ten type scores)"} style={{
      display: "flex", alignItems: "baseline", gap: "0.45rem",
      padding: "0.5rem 0.85rem",
      backgroundColor: provisional ? C.surface : C.accentDim,
      border: `1px solid ${provisional ? C.border : `${C.accent}50`}`,
      borderRadius: "999px",
    }}>
      <span className="label" style={{ color: provisional ? C.textDim : C.accentBright }}>{label}{provisional ? " (running)" : ""}</span>
      <span className="mono" style={{ fontSize: "15px", fontWeight: 700, color: provisional ? C.textDim : C.accentBright, fontVariantNumeric: "tabular-nums" }}>
        {typeof value === "number" ? value.toFixed(1) : "—"}
      </span>
      <span className="mono" style={{ fontSize: "10px", color: C.textMuted }}>/100</span>
    </div>
  );
}

function RubricStrip({ compact }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: "0.5rem", marginBottom: compact ? "1rem" : "1.5rem" }}>
      {RUBRIC.map(r => (
        <div key={r.n} style={{ display: "flex", gap: "0.55rem", alignItems: "flex-start", padding: "0.5rem 0.7rem", backgroundColor: C.surface, border: `1px solid ${C.border}`, borderRadius: "8px" }}>
          <span className="mono" style={{ fontSize: "14px", fontWeight: 700, color: C.accentBright, lineHeight: 1.2 }}>{r.n}</span>
          <span style={{ fontSize: "0.78rem", lineHeight: 1.35, color: C.textDim }}><strong style={{ color: C.text }}>{r.label}</strong> — {r.desc}</span>
        </div>
      ))}
    </div>
  );
}

function ProgressPill({ label, value, total, accent }) {
  const pct = (value / total) * 100;
  const color = accent ? C.accent : C.success;
  return (
    <div style={{ padding: "0.45rem 0.85rem", backgroundColor: C.surface, border: `1px solid ${C.border}`, borderRadius: "999px", display: "flex", alignItems: "center", gap: "0.55rem" }}>
      <div style={{ width: "26px", height: "4px", backgroundColor: C.surface3, borderRadius: "999px", overflow: "hidden" }}>
        <div style={{ width: `${pct}%`, height: "100%", backgroundColor: color, borderRadius: "999px", transition: "width 0.3s" }} />
      </div>
      <span className="mono" style={{ fontSize: "11px", color: C.text, fontWeight: 600 }}>
        {value}<span style={{ color: C.textDim, fontWeight: 400 }}>/{total}</span>
      </span>
      <span className="mono" style={{ fontSize: "9px", color: C.textDim, letterSpacing: "0.08em", textTransform: "uppercase" }}>{label}</span>
    </div>
  );
}

function ExportRow({ icon, title, subtitle, onClick, primary, done }) {
  const [hover, setHover] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        display: "flex",
        alignItems: "center",
        gap: "0.85rem",
        padding: "0.85rem 1rem",
        backgroundColor: hover ? C.surface2 : C.surface,
        border: `1px solid ${primary ? `${C.accent}40` : done ? `${C.success}40` : C.border}`,
        borderRadius: "10px",
        cursor: "pointer",
        textAlign: "left",
        transition: "all 0.15s",
        width: "100%",
        color: C.text,
      }}
    >
      <div style={{
        width: "36px", height: "36px",
        backgroundColor: primary ? C.accentDim : done ? `${C.success}15` : C.surface3,
        borderRadius: "8px",
        display: "flex", alignItems: "center", justifyContent: "center",
        flexShrink: 0,
      }}>
        {icon}
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: "0.92rem", fontWeight: 600, color: C.text, marginBottom: "0.1rem" }}>{title}</div>
        <div style={{ fontSize: "0.78rem", color: C.textDim, lineHeight: 1.3 }}>{subtitle}</div>
      </div>
      <ChevronRight size={16} color={C.textDim} style={{ flexShrink: 0 }} />
    </button>
  );
}

    const rootEl = document.getElementById("root");
    rootEl.setAttribute("data-iw-mounted", "true");
    createRoot(rootEl).render(<InnovationWorkshop />);
  </script>
</body>
</html>
