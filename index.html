// A type gets a score only when every one of its questions is answered.
const rollUpTypeScores = (qs) => {
  const out = {};
  TYPES_ORDER.forEach(t => {
    const r = computeTypeScore(t, qs);
    out[t] = r.scored === r.total ? r.score : null;

};

// Total Innovation Score: sum of the ten 0–10 type scores → 0–100. Null until all ten are complete.
const totalFromTypeScores = (typeScores) => {
  const vals = TYPES_ORDER.map(t => typeScores[t]);
  if (vals.some(v => typeof v !== "number")) return null;

};

const TACTIC_FIELDS = [

  { key: "evidence", label: "Evidence",               placeholder: "Cite your scoring or the AI responses — e.g., 'SV3 scored 0 by team and both AIs: no distinctive warranty.'" },
  { key: "adoption", label: "What adoption requires", placeholder: "Capability, investment, partner, or what the company would have to stop doing." },

const tacticComplete = (r) => TACTIC_FIELDS.every(f => (r[f.key] || "").trim().length > 0);

const computeTypeScore = (typeName, qs) => {
  const w = WEIGHTS[typeName];
  const idxs = QUESTIONS.map((q, i) => q.type === typeName ? i : -1).filter(i => i >= 0);
  let sum = 0;
  let scored = 0;
  idxs.forEach(globalIdx => {
    const localIdx = QUESTIONS.slice(0, globalIdx).filter(q => q.type === typeName).length;
    const v = qs[`${typeName}:${localIdx}`];
    if (typeof v === "number") {
      sum += v * w;
      scored++;
    }
  });
  return { score: sum, scored, total: idxs.length };
};

// Parse an AI response that answers the diagnostic questions as lines like
//   "PM1: 2 | evidence"   — also tolerates markdown bold, bullets, tables ("| PM1 | 2 | evidence |"),
//   "PM-1 = 2 — evidence", "PM1 (2/3): evidence", and echoed question text before the score.
// Returns { scores: { "Type:i": 0–3 }, evidence: { "Type:i": "..." }, summary: "..." }.
const CODE_ALT = "PM|NW|ST|PR|PP|PS|SV|CH|BR|CE";
const NONE_RE = /^(none|no source|no sources|no public source|no reliable|not available|unavailable|n\/a)\b/i;

// Turn one SRC line's text into { title, url } — handles plain URLs, markdown links,
// and reference-style citations ("[Reuters][3]" resolved from "[3]: https://..." lines).
const parseSourceText = (txt, refs) => {
  let url = null;
  const direct = txt.match(/https?:\/\/[^\s<>()\]\[]+/);
  if (direct) url = direct[0].replace(/[.,;:'"]+$/, "");
  if (!url) {
    const ref = txt.match(/\[[^\]]*\]\s*\[(\w+)\]/) || txt.match(/\[(\d+)\]/);
    if (ref && refs[ref[1]]) url = refs[ref[1]].url;
  }
  let title = txt
    .replace(/\(?https?:\/\/[^\s<>()]+\)?/g, "")
    .replace(/\[([^\]]*)\]\s*\[\w+\]/g, "$1")
    .replace(/\[([^\]]*)\]/g, "$1")
    .replace(/\s*[—–|-]\s*$/, "")
    .replace(/\s{2,}/g, " ")
    .trim();
  if (!title && url) { try { title = new URL(url).hostname.replace(/^www\./, ""); } catch (e) { title = url; } }
  return { title, url };
};

const parseAIResponse = (text) => {
  const scores = {};
  const evidence = {};
  const sources = {};      // type -> [{ title, url }]
  const noSource = {};     // type -> reason the AI gave for citing nothing
  const srcSeen = {};      // type -> true if any SRC line appeared
  if (!text) return { scores, evidence, sources, noSource, srcSeen, summary: "" };
  // Some chat UIs collapse lines when copied: put each "CODE: n" and "SRC-CODE:" back on its own line.
  const pre = text
    .replace(new RegExp(`([^\\n])[ \\t]+(?=(?:\\*\\*)?(?:${CODE_ALT})\\d\\s*\\**\\s*[:=]\\s*\\**\\s*[0-3](?!\\d))`, "g"), "$1\n")
    .replace(new RegExp(`([^\\n])[ \\t]+(?=(?:\\*\\*)?SRC[-_ ]?(?:${CODE_ALT})\\b)`, "gi"), "$1\n");
  const lines = pre.split(/\r?\n/);
  // Reference-style link definitions, e.g. '[3]: https://example.com "Title"'
  const refs = {};
  lines.forEach(l => {
    const r = l.match(/^\s*\[(\w+)\]:\s*(https?:\/\/\S+)(?:\s+"([^"]*)")?/);
    if (r) refs[r[1]] = { url: r[2], title: r[3] || "" };
  });
  const srcRe = new RegExp(`^[\\s*#>|\\-•·]*SRC[-_ ]?(${CODE_ALT})\\b[\\s*]*[:|\\-–—]?\\s*(.*)$`, "i");
  const codeRe = new RegExp(`(?:^|[^A-Za-z])(${CODE_ALT})\\s*[-_.]?\\s*(\\d)(?!\\d)`, "i");
  const leftover = [];
  for (const rawLine of lines) {
    const line = rawLine.replace(/\*\*|__|`/g, "");
    if (/^\s*\[(\w+)\]:\s*https?:\/\//.test(line)) continue;
    const sm0 = line.match(srcRe);
    if (sm0) {
      const typeName = CODE_TO_TYPE[sm0[1].toUpperCase()];
      const body = sm0[2].replace(/[\s|]+$/, "").trim();
      if (/^\(source line/i.test(body)) continue; // echoed prompt placeholder
      srcSeen[typeName] = true;
      if (!body || NONE_RE.test(body)) {
        noSource[typeName] = body.replace(NONE_RE, "").replace(/^[\s:—–\-|]+/, "").trim() || "No reliable public source found.";
      } else {
        const src = parseSourceText(body, refs);
        if (src.title || src.url) (sources[typeName] = sources[typeName] || []).push(src);
      }
      continue;
    }
    const m = line.match(codeRe);
    let matched = false;
    if (m && m.index <= 12) {
      const typeName = CODE_TO_TYPE[m[1].toUpperCase()];
      const qIdx = parseInt(m[2], 10) - 1;
      const nQ = QUESTIONS.filter(q => q.type === typeName).length;
      if (typeName && qIdx >= 0 && qIdx < nQ) {
        const rest = line.slice(m.index + m[0].length);
        // 1) Score immediately after the code: "PM1: 2 | ..." / "| PM1 | 2 |" / "PM1 (2/3)"
        let sm = rest.match(/^[\s:=|.)(\]\-–—]*([0-3])(?:\.0+)?(?!\d)\s*(?:\/\s*3)?\s*\)?(.*)$/);
        // 2) Fallback: question text echoed first, score after a separator: "PM1. Does ...? — 2 | ..."
        if (!sm) sm = rest.match(/(?:[:|—–=]|score\s*[:=]?)\s*([0-3])(?:\.0+)?(?!\d)\s*(?:\/\s*3)?\s*(?:[|—–:\-]\s*(.*)|$)/i);
        if (sm) {
          const key = `${typeName}:${qIdx}`;
          scores[key] = parseInt(sm[1], 10);
          const ev = (sm[2] || "").replace(/^[\s|:\-–—]+/, "").replace(/[\s|]+$/, "").trim();
          if (ev) evidence[key] = ev;
          matched = true;
        }
      }
    }
    if (!matched) leftover.push(rawLine);
  }
  // The strength/gap paragraph: longest leftover paragraph that isn't a header.
  const paras = leftover.join("\n").split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 80);
  const summary = paras.sort((a, b) => b.length - a.length)[0] || "";
  // A declared "none" only counts if the type has no real citation as well.
  Object.keys(sources).forEach(t => { delete noSource[t]; });
  return { scores, evidence, sources, noSource, srcSeen, summary };
};

// Per-type source status for one AI:
//   linked   — at least one citation with a URL (verifiable)
//   unlinked — citation(s) but no URL to open
//   declared — the AI stated no reliable public source exists (can be legitimate for private companies)
//   missing  — no SRC line at all
const sourceStatus = (parsed, typeName) => {
  const list = parsed.sources[typeName] || [];
  if (list.some(x => x.url)) return "linked";
  if (list.length) return "unlinked";
  if (parsed.noSource[typeName] !== undefined) return "declared";
  return "missing";
};
const SOURCE_STATUS = {
  linked:   { label: "Linked source",        short: "SRC ✓",    tone: "success" },
  unlinked: { label: "Cited, no link",       short: "NO LINK",  tone: "warning" },
  declared: { label: "No public source",     short: "NONE",     tone: "warning" },
  missing:  { label: "No source given",      short: "MISSING",  tone: "danger"  },
};
const PRIVATE_CO_CAVEAT = "Private companies often don't disclose financials, ownership, or internal operations, so \"no public source\" can be a legitimate answer. Treat those scores as lower-confidence rather than wrong.";
const highScoreUnsourced = (parsed, q, typeName) =>
  sourceStatus(parsed, typeName) !== "linked" &&
  QUESTIONS.filter(x => x.type === typeName).some((_, i) => (q[`${typeName}:${i}`] ?? -1) >= 2);

const buildAIPrompt = (companyName, companyContext) => {
  const name = companyName || "[COMPANY NAME]";
  const asOf = new Date().toLocaleDateString("en-US", { month: "long", year: "numeric" });

  const qBlock = TYPES_ORDER.map(t => {

  }).join("\n\n");
  return `You are an expert innovation analyst. Assess ${name} using Larry Keeley's Doblin Ten Types of Innovation framework (Keeley et al., 2013). Use publicly available information as of ${asOf}. Search the web before answering if you can.
${scope}
Answer each of the ${NQ} diagnostic questions below on this 0–3 scale, judged relative to direct competitors and industry norms:
${RUBRIC.map(r => `  ${r.n} = ${r.label} — ${r.desc}`).join("\n")}
If you cannot find public evidence for a question, score it 0 and write "no public evidence".

FORMAT — one line per question, using the code shown:

SOURCES — after the last question of each type, add 1–3 source lines for that type:

- Every type must have at least one SRC line.

- Cite only sources you actually consulted. Never invent a title or URL.
- If no reliable public source exists (common for private companies that do not disclose financials, ownership, or operations), write: SRC-CODE: none — brief reason

Example:
PM1: 2 | Sells hardware near cost and earns most of its margin on subscriptions.
...
PM7: 1 | Inventory turns are in line with peers.
SRC-PM: FY2025 Annual Report (Form 10-K) — Example Corp, Feb 2026 — https://www.example.com/10k-2025
SRC-PM: "Example Corp's subscription pivot" — Reuters, Mar 2026 — https://www.reuters.com/...

Rules: list all ${NQ} question codes in order, each type followed by its SRC line(s); do not use a table; do not add type totals or 0–10 scores (the workshop calculates those).

${qBlock}

After the last SRC line, write one short paragraph (3–4 sentences) naming the company's single biggest innovation strength and single biggest gap, with one concrete piece of evidence for each.`;
};

// Draws the three-way bar chart to a PNG (Uint8Array) for the report.
const drawChartPNG = async ({ series, labels }) => {
  try {
    const W = 1872, H = 860, S = 2; // 2x for print sharpness (renders at 936x430 px)
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");
    g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, W, H);
    const L = 70 * S / 2, R = W - 20, T = 40, B = H - 150;
    g.font = `${11 * S}px Calibri, Arial, sans-serif`;
    // gridlines
    for (let v = 0; v <= 10; v += 2) {
      const y = B - (v / 10) * (B - T);
      g.strokeStyle = v === 0 ? "#475569" : "#E2E8F0"; g.lineWidth = v === 0 ? 2 : 1.5;
      g.beginPath(); g.moveTo(L, y); g.lineTo(R, y); g.stroke();
      g.fillStyle = "#64748B"; g.textAlign = "right"; g.textBaseline = "middle";
      g.fillText(String(v), L - 12, y);
    }
    const groups = labels.length, gw = (R - L) / groups, bw = gw * 0.22, gap = gw * 0.04;
    labels.forEach((lab, i) => {
      const x0 = L + i * gw + (gw - (3 * bw + 2 * gap)) / 2;
      series.forEach((s, k) => {
        const v = typeof s.values[i] === "number" ? s.values[i] : 0;
        const h = (v / 10) * (B - T);
        const x = x0 + k * (bw + gap);
        g.fillStyle = s.color; g.fillRect(x, B - h, bw, h);
        g.fillStyle = s.color; g.textAlign = "center"; g.textBaseline = "bottom";
        g.font = `bold ${9 * S}px Calibri, Arial, sans-serif`;
        g.fillText(typeof s.values[i] === "number" ? s.values[i].toFixed(1) : "—", x + bw / 2, B - h - 4);
      });
      g.fillStyle = "#334155"; g.textAlign = "center"; g.textBaseline = "top";
      g.font = `${10.5 * S}px Calibri, Arial, sans-serif`;
      String(lab).split("\n").forEach((ln, j) => g.fillText(ln, L + i * gw + gw / 2, B + 12 + j * 24));
    });
    // legend
    g.font = `${11 * S}px Calibri, Arial, sans-serif`; g.textBaseline = "middle"; g.textAlign = "left";
    const widths = series.map(s => g.measureText(s.name).width + 60);
    let lx = (W - widths.reduce((a, b) => a + b, 0)) / 2;
    series.forEach((s, k) => {
      g.fillStyle = s.color; g.fillRect(lx, H - 40, 24, 24);
      g.fillStyle = "#334155"; g.fillText(s.name, lx + 34, H - 28);
      lx += widths[k];
    });
    const blob = await new Promise(res => cv.toBlob(res, "image/png"));
    return new Uint8Array(await blob.arrayBuffer());
  } catch (e) { return null; }
};

      ], { w: CW / 2, left: line(RULE, 6), ml: 300 }),
    ])], [CW / 2, CW / 2]),
    spacer(150),
    p([r(`Confidential  ·  Prepared for discussion purposes  ·  Innovation Workshop ${d.APP_VERSION}`, { size: 8, color: MUTED })], { border: { top: { style: BorderStyle.SINGLE, size: 4, color: RULE, space: 6 } } }),
  ];

  // ---------- CONTENTS ----------
  const TOC = [
    ["sec_exec", "•", "Executive Summary", "Headline findings and recommendations at a glance"],
    ["sec_recs", "1", "Strategic Recommendations", "The moves we recommend, the evidence, and what adoption requires"],
    ["sec_profile", "2", "Innovation Profile", "Scores for all ten innovation types and the Total Innovation Score"],
    ["sec_tri", "3", "Triangulation", "Where the team and two independent AI assessments agree and differ"],
    ["sec_evidence", "4", "Evidence Quality", "Source coverage and the team's verification of AI citations"],
    ["sec_appA", "A", "Appendix A · Question-Level Scoring", `All ${d.NQ} diagnostic questions, three sources, with AI evidence`],
    ["sec_appB", "B", "Appendix B · AI Citations", "Every source each AI cited, by innovation type, with links"],
    ["sec_appC", "C", "Appendix C · Methodology", "Framework, scoring instrument, thresholds, and limitations"],
  ];
  const contents = [
    p([r("Contents", { size: 9, bold: true, color: GOLD, caps: true, spacing: 40 })], { after: 2 }),
    p([r("In this report", { font: SERIF, size: 24, color: NAVY })], { after: 12 }),
    table(TOC.map(([id, n, title, desc]) => row([
      cell([p([r(n, { font: SERIF, size: 16, color: GOLD })], { after: 0 })], { w: 700, bottom: line(), ml: 0, mt: 150, mb: 150 }),
      cell([
        p([new InternalHyperlink({ anchor: id, children: [r(title, { size: 13, bold: true, color: NAVY })] })], { after: 2 }),
        p([r(desc, { size: 9.5, color: MUTED })], { after: 0 }),
      ], { w: CW - 700, bottom: line(), mt: 150, mb: 150 }),
    ])), [700, CW - 700]),
    note("Section titles are links. Scores are on a 0–10 scale per innovation type; the Total Innovation Score is out of 100.", { after: 0 }),
  ];

  // ---------- EXECUTIVE SUMMARY ----------
  const tileCell = (label, total, strong, color, extra) => cell([
    p([r(label, { size: 8, bold: true, color: MUTED, caps: true, spacing: 20 })], { after: 2 }),
    p([r(f1(total), { font: SERIF, size: 24, color }), r("  / 100", { size: 10, color: MUTED })], { after: 2, line: 1.0 }),
    p([r(`Strong types: ${strong} of 10${extra ? `  ·  ${extra}` : ""}`, { size: 8.5, color: SLATE })], { after: 0 }),
  ], { w: Math.floor(CW / 3), fill: TINT, top: line(color, 18), ml: 160, mr: 120, mt: 100, mb: 100 });
  const tiles = table([row([
    tileCell("Team assessment", d.teamTotal, ins.strongTeam, TEAM),
    tileCell(a1, d.ai1Total, ins.strongA1, AI1, `${ins.linked1}/10 sourced`),
    tileCell(a2, d.ai2Total, ins.strongA2, AI2, `${ins.linked2}/10 sourced`),
  ])], [Math.floor(CW / 3), Math.floor(CW / 3), CW - 2 * Math.floor(CW / 3)]);

  const findingsTbl = table(ins.findings.map((fd, i) => row([
    cell([p([r(String(i + 1), { bold: true, color: GOLD, size: 10 })], { after: 0 })], { w: 360, ml: 0, mt: 40, mb: 40 }),
    cell([p([r(`${fd.title}. `, { bold: true, color: NAVY, size: 9.5 }), r(fd.text, { size: 9.5 })], { after: 0, line: 1.1 })], { w: CW - 360, mt: 40, mb: 40 }),
  ])), [360, CW - 360]);

  const recs = d.tacticRecs;
  const impact = recs.length ? `If these moves succeed, ${company} would have up to ${d.projectedStrong} strong innovation types (from ${ins.strongTeam} today)${d.projectedStrong >= 5 ? ", reaching the five-type threshold" : `, still ${5 - d.projectedStrong} short of the five-type threshold`}. The portfolio spans ${ins.recCats.length} of 3 categories (${ins.recCats.join(", ")}).` : "";
  const recBox = table([row([cell([
    p([r("Our recommendations", { size: 8.5, bold: true, color: GOLD, caps: true, spacing: 30 })], { after: 2 }),
    p([r(recs.length ? `${recs.length} moves for ${company}` : "No recommendations recorded", { font: SERIF, size: 15, color: NAVY })], { after: 6 }),
    ...(recs.length ? [table(recs.map((rc, i) => {
      const cat = d.TYPE_INFO[rc.type].category;
      return row([
        cell([p([r(String(i + 1), { font: SERIF, size: 20, color: NAVY })], { after: 0, line: 1.0 })], { w: 560, ml: 0, top: line(), mt: 90, mb: 90 }),
        cell([
          p([r(rc.name, { size: 12, bold: true, color: NAVY }), r(`   ${rc.type} · ${cat}`, { size: 8.5, color: CAT[cat] })], { after: 2 }),
          p([r("Why: ", { bold: true, size: 9.5 }), r((rc.gap || "").trim() || "—", { size: 9.5 })], { after: 1, line: 1.15 }),
          p([r("What it takes: ", { bold: true, size: 9.5 }), r((rc.adoption || "").trim() || "—", { size: 9.5 })], { after: 0, line: 1.15 }),
        ], { w: CW - 560 - 560, top: line(), mt: 90, mb: 90 }),
      ]);
    }), [560, CW - 1120])] : []),
    ...(impact ? [p([r(impact, { size: 9.5, color: SLATE })], { before: 6, after: 0, line: 1.15 })] : []),
  ], { w: CW, top: line(NAVY, 12), bottom: line(NAVY, 12), left: line(NAVY, 12), right: line(NAVY, 12), ml: 260, mr: 260, mt: 160, mb: 160 })])], [CW]);

  const execSummary = [
    ...sectionHead("sec_exec", "Executive summary", "The bottom line", ins.headline),
    tiles,
    spacer(6),
    recBox,
    h3("Key findings", NAVY, { before: 10 }),
    findingsTbl,
  ];

  // ---------- 1. RECOMMENDATIONS ----------
  const recPoints = [];
  if (recs.length) {
    recPoints.push(`${recs.length} recommended moves across ${ins.recCats.length} of 3 innovation categories (${ins.recCats.join(", ")}).${ins.recCats.length === 1 && recs.length > 1 ? " A single-category portfolio is easier for competitors to copy; the team should be ready to defend the focus." : ""}`);
    recPoints.push(`Path to five: strong types rise from ${ins.strongTeam} to as many as ${d.projectedStrong} if every move succeeds${d.projectedStrong >= 5 ? " — enough to clear the five-type threshold" : ""}.`);
    const attacked = [...new Set(recs.filter(rc => (ins.means[rc.type] ?? 10) < 5).map(rc => rc.type))];
    if (attacked.length) recPoints.push(`${ins.listJoin(attacked)} ${attacked.length === 1 ? "is an opportunity type" : "are opportunity types"} (three-source average below 5), where a move is least expected.`);
    if (ins.doublingDown.length) recPoints.push(`${ins.listJoin(ins.doublingDown.map(x => x.name))} ${ins.doublingDown.length === 1 ? "builds" : "build"} on an existing strength rather than closing a gap.`);
  } else recPoints.push("No recommendations were recorded.");

  const recCard = (rc, i) => {
    const cat = d.TYPE_INFO[rc.type].category, cc = CAT[cat];
    const tdef = d.TACTICS.find(x => x.type === rc.type && x.name === rc.name);
    const strong = typeof d.teamTypeFinal[rc.type] === "number" && d.teamTypeFinal[rc.type] >= d.STRONG_THRESHOLD;
    const field = (label, val) => row([
      cell([p([r(label, { size: 8.5, bold: true, color: MUTED, caps: true, spacing: 15 })], { after: 0 })], { w: 2200, top: line(), ml: 0, mt: 90, mb: 90 }),
      cell([p([r((val || "").trim() || "(not recorded)", { size: 10 })], { after: 0, line: 1.2 })], { w: CW - 2200, top: line(), mt: 90, mb: 90 }),
    ]);
    return [spacer(10), table([row([cell([
      table([row([
        cell([p([r(String(i + 1).padStart(2, "0"), { font: SERIF, size: 30, color: NAVY })], { after: 0, line: 1.0 })], { w: 900, ml: 0 }),
        cell([
          p([r(`${rc.type} · ${cat}`, { size: 8.5, bold: true, color: cc, caps: true, spacing: 15 }), ...(strong ? [r("     Builds on a strength", { size: 8, bold: true, color: "047857" })] : [])], { after: 1 }),
          p([r(rc.name, { font: SERIF, size: 16, color: NAVY })], { after: 2 }),
          ...(tdef ? [p([r(tdef.desc, { size: 9.5, italic: true, color: SLATE })], { after: 3 })] : []),
          p([r(`Current ${rc.type} score:  `, { size: 8.5, color: MUTED }), r(`Team ${fmt(d.teamTypeFinal[rc.type])}`, { size: 8.5, bold: true, color: TEAM }), r("  ·  ", { size: 8.5, color: MUTED }), r(`${a1} ${fmt(d.ai1Scores[rc.type])}`, { size: 8.5, bold: true, color: AI1 }), r("  ·  ", { size: 8.5, color: MUTED }), r(`${a2} ${fmt(d.ai2Scores[rc.type])}`, { size: 8.5, bold: true, color: AI2 })], { after: 4 }),
        ], { w: CW - 900 }),
      ])], [900, CW - 900]),
      table([field("The opportunity", rc.gap), field("Supporting evidence", rc.evidence), field("What adoption requires", rc.adoption)], [2200, CW - 2200]),
    ], { w: CW, top: line(cc, 18), ml: 0, mr: 0, mt: 140, mb: 60 })])], [CW])];
  };

  const recSection = [
    ...sectionHead("sec_recs", "Section 1", "Strategic Recommendations", `The moves the team recommends ${company} make next, chosen from Doblin's library of ${d.TACTICS.length} innovation tactics and targeted at the gaps the diagnostic revealed.`),
    keyPoints(recPoints),
    ...(recs.length ? recs.flatMap(recCard) : [note("No tactics were recorded.")]),
  ];

  // ---------- 2. INNOVATION PROFILE ----------
  const PW = [1500, 2350, 950, 1150, 1150, 1000, CW - (1500 + 2350 + 950 + 1150 + 1150 + 1000)];
  const profileRows = d.TYPES_ORDER.map((t, idx) => {
    const cat = d.TYPE_INFO[t].category;
    const prev = idx ? d.TYPE_INFO[d.TYPES_ORDER[idx - 1]].category : null;
    const tier = ins.tier(ins.means[t]);
    return row([
      td(cat !== prev ? cat : "", PW[0], { size: 8.5, bold: true, color: CAT[cat] }),
      td(t, PW[1], { bold: true }),
      num(d.teamTypeFinal[t], PW[2], TEAM), num(d.ai1Scores[t], PW[3], AI1), num(d.ai2Scores[t], PW[4], AI2),
      td(f1(ins.means[t]), PW[5], { align: AlignmentType.RIGHT, bold: true }),
      td(tier, PW[6], { size: 8.5, bold: true, color: TIER[tier] }),
    ]);
  });
  const sumRow = (label, v0, v1, v2, o = {}) => row([
    cell([p([r(label, { size: 9.5, bold: o.bold })], { after: 0 })], { w: PW[0] + PW[1], span: 2, fill: o.fill, top: o.top, bottom: line(), mt: 70, mb: 70 }),
    cell([p([r(String(v0), { size: 9.5, bold: o.bold, color: TEAM })], { after: 0, align: AlignmentType.RIGHT })], { w: PW[2], fill: o.fill, top: o.top, bottom: line(), mt: 70, mb: 70 }),
    cell([p([r(String(v1), { size: 9.5, bold: o.bold, color: AI1 })], { after: 0, align: AlignmentType.RIGHT })], { w: PW[3], fill: o.fill, top: o.top, bottom: line(), mt: 70, mb: 70 }),
    cell([p([r(String(v2), { size: 9.5, bold: o.bold, color: AI2 })], { after: 0, align: AlignmentType.RIGHT })], { w: PW[4], fill: o.fill, top: o.top, bottom: line(), mt: 70, mb: 70 }),
    cell([p("")], { w: PW[5] + PW[6], span: 2, fill: o.fill, top: o.top, bottom: line(), mt: 70, mb: 70 }),
  ]);
  const profileTable = table([
    row([th("Category", PW[0]), th("Innovation type", PW[1]), th("Team", PW[2], AlignmentType.RIGHT), th(a1, PW[3], AlignmentType.RIGHT), th(a2, PW[4], AlignmentType.RIGHT), th("Average", PW[5], AlignmentType.RIGHT), th("Position", PW[6])], { header: true }),
    ...profileRows,
    sumRow("Total Innovation Score (0–100)", f1(d.teamTotal), f1(d.ai1Total), f1(d.ai2Total), { bold: true, fill: TINT, top: line(NAVY, 8) }),
    sumRow(`Strong types (score ≥ ${d.STRONG_THRESHOLD})`, ins.strongTeam, ins.strongA1, ins.strongA2),

  ], PW);

  const profilePoints = [
    `Total Innovation Score: Team ${f1(d.teamTotal)}, ${a1} ${f1(d.ai1Total)}, ${a2} ${f1(d.ai2Total)} (out of 100).`,
    ins.topTypes.length ? `Strongest: ${ins.listJoin(ins.topTypes.map(t => `${t} (${f1(ins.means[t])})`))}.` : null,
    ins.bottomTypes.length ? `Weakest: ${ins.listJoin(ins.bottomTypes.map(t => `${t} (${f1(ins.means[t])})`))}.` : null,
    ins.catMeans.length >= 2 ? `By category: ${ins.catMeans.map(c => `${c.cat} ${f1(c.mean)}`).join("  ·  ")}.` : null,
  ].filter(Boolean);

  const chartBlock = d.chartPng ? [
    p([r("Exhibit 1  ·  Score by innovation type, three assessments (0–10)", { size: 8.5, bold: true, color: MUTED, caps: true, spacing: 15 })], { before: 12, after: 4, keepNext: true }),
    p([new ImageRun({ type: "png", data: d.chartPng, transformation: { width: 600, height: 276 } })], { align: AlignmentType.CENTER, after: 0, line: 1 }),
  ] : null;

  const profileSection = [
    ...sectionHead("sec_profile", "Section 2", "Innovation Profile", `How ${company} scores on each of the ten innovation types, according to the team and two independent AI assessments using the same ${d.NQ}-question instrument.`),
    keyPoints(profilePoints),
    spacer(8),
    profileTable,
    note(`Type scores run 0–10 and sum to the Total Innovation Score. Position uses the three-source average: Differentiator ≥ ${d.STRONG_THRESHOLD}.0, Developing 5.0–6.9, Opportunity below 5.0.`, { after: 0 }),
  ];

  // ---------- 3. TRIANGULATION ----------
  const TW = [2600, 950, 1150, 1150, CW - (2600 + 950 + 1150 + 1150)];
  const patternTable = (title, desc, color, items, noteFn) => keep([
    h3(title, color, { before: 12 }),
    note(desc, { keepNext: true }),
    table([
      row([th("Innovation type", TW[0]), th("Team", TW[1], AlignmentType.RIGHT), th(a1, TW[2], AlignmentType.RIGHT), th(a2, TW[3], AlignmentType.RIGHT), th("Observation", TW[4])], { header: true }),
      ...(items.length ? items.map(it => row([
        td(it.type, TW[0], { bold: true }), num(it.team, TW[1], TEAM), num(it.ai1, TW[2], AI1), num(it.ai2, TW[3], AI2),
        td(noteFn ? noteFn(it) : "All three within 1.5 points", TW[4], { size: 9, color: SLATE }),
      ])) : [row([cell([p([r("None.", { size: 9, italic: true, color: MUTED })], { after: 0 })], { w: CW, span: 5, bottom: line() })])]),
    ], TW),
  ]);
  const QW = [700, CW - 700 - 3 * 760, 760, 760, 760];
  const qHeader = () => row([th("Code", QW[0]), th("Question and AI evidence", QW[1]), th("Team", QW[2], AlignmentType.RIGHT), th("AI 1", QW[3], AlignmentType.RIGHT), th("AI 2", QW[4], AlignmentType.RIGHT)], { header: true });
  // kn = keep this row with the next one (keeps a whole type's table on one page when it fits)
  const qRow = (g, noteTxt, small, kn) => {
    const sc = (v, w, color) => cell([p([r(typeof v === "number" ? String(v) : "—", { size: 9.5, bold: true, color })], { after: 0, align: AlignmentType.RIGHT, keepNext: kn })], { w, bottom: line(), mt: 70, mb: 70 });
    return row([
      cell([p([r(g.code, { size: small ? 8.5 : 9, bold: true })], { after: 0, keepNext: kn })], { w: QW[0], bottom: line(), mt: 70, mb: 70 }),
      cell([
        p([r(g.text, { size: small ? 9 : 9.5 })], { after: 1, keepNext: kn }),
        ...(noteTxt ? [p([r(noteTxt, { size: 8.5, color: MUTED, italic: true })], { after: 1, keepNext: kn })] : []),
        ...(g.ev1 ? [p([r(`${a1}: `, { size: 8, bold: true, color: AI1 }), r(g.ev1, { size: 8, color: SLATE })], { after: 1, keepNext: kn })] : []),
        ...(g.ev2 ? [p([r(`${a2}: `, { size: 8, bold: true, color: AI2 }), r(g.ev2, { size: 8, color: SLATE })], { after: 0, keepNext: kn })] : []),
      ], { w: QW[1], bottom: line(), mt: 70, mb: 70 }),
      sc(g.team, QW[2], TEAM), sc(g.ai1, QW[3], AI1), sc(g.ai2, QW[4], AI2),
    ]);
  };
  const qGapTeam = [...d.questionGaps].filter(g => Math.abs(g.teamVsAI) >= 1.5).sort((x, y) => Math.abs(y.teamVsAI) - Math.abs(x.teamVsAI)).slice(0, 6);
  const qGapAI = [...d.questionGaps].filter(g => g.aiSpread >= 2).sort((x, y) => y.aiSpread - x.aiSpread).slice(0, 4);
  const qBlock = (title, desc, rows, noteFn) => [
    h3(title, NAVY, { before: 16 }),
    note(desc, { keepNext: true }),
    rows.length ? table([qHeader(), ...rows.map(g => qRow(g, noteFn(g)))], QW) : note("None at this threshold.", { italic: true }),
  ];
  const triPoints = [
    `${ins.consensus.length} of 10 types show three-way consensus (all scores within 1.5 points).`,
    ins.biggestPerception ? `Largest team-versus-AI gap: ${ins.biggestPerception.type} — the team scores it ${Math.abs(ins.biggestPerception.teamVsAI).toFixed(1)} points ${ins.biggestPerception.teamVsAI > 0 ? "higher" : "lower"} than the AI average.` : null,
    ins.biggestAISplit ? `The AIs disagree most on ${ins.biggestAISplit.type} (${ins.biggestAISplit.aiSpread.toFixed(1)}-point spread), a sign the framework is ambiguous here or the models drew on different information.` : null,
    d.questionGaps.length ? `At question level, all three sources gave the identical answer on ${ins.qIdentical} of ${d.questionGaps.length} questions.` : null,
  ].filter(Boolean);
  const consensusItems = [...ins.consensus].sort((x, y) => y.team - x.team).slice(0, 4);
  const teamVsAIs = [...d.triangulation].sort((x, y) => Math.abs(y.teamVsAI) - Math.abs(x.teamVsAI)).slice(0, 3);
  const aisDisagree = [...d.triangulation].sort((x, y) => y.aiSpread - x.aiSpread).slice(0, 3);
  const perspectives = keep([
    h3("Independent AI perspectives", NAVY, { before: 16 }),
    table([
      row([td(a1, 1900, { bold: true, color: AI1 }), td(d.ai1Parsed.summary || "(no summary paragraph found)", CW - 1900)]),
      row([td(a2, 1900, { bold: true, color: AI2 }), td(d.ai2Parsed.summary || "(no summary paragraph found)", CW - 1900)]),
    ], [1900, CW - 1900]),
  ]);
  const triSection = [
    ...sectionHead("sec_tri", "Section 3", "Triangulation", "Three independent views of the same company. Agreement signals a robust finding; disagreement shows where the evidence is thin or the framework is open to interpretation."),
    keyPoints(triPoints),
    ...(chartBlock || []),
    ...(d.triangulation.length ? [
      patternTable("Consensus", "Types where all three assessments fall within 1.5 points — the most robust findings.", "047857", consensusItems, null),
      patternTable("Team versus AIs", "Types where the team's view departs most from the AI average.", TEAM, teamVsAIs, c => `Team ${c.teamVsAI > 0 ? "higher" : "lower"} by ${Math.abs(c.teamVsAI).toFixed(1)}`),
      patternTable("AIs disagree", `Types where ${a1} and ${a2} are furthest apart.`, AI2, aisDisagree, c => `AI spread ${c.aiSpread.toFixed(1)}`),
      ...qBlock("Question-level drivers: team versus AIs", "Questions where the team's 0–3 answer is at least 1.5 points from the AI average.", qGapTeam, g => `Team ${g.teamVsAI > 0 ? "higher" : "lower"} than the AI average by ${Math.abs(g.teamVsAI).toFixed(1)}`),
      ...qBlock("Question-level drivers: AIs disagree", "Questions where the two AIs are at least 2 points apart.", qGapAI, g => `AI spread ${g.aiSpread}`),
      perspectives,
    ] : [note("Triangulation requires complete scoring from the team and both AIs.")]),
  ];

  // ---------- 4. EVIDENCE QUALITY ----------
  const vq = ins.vq;
  const evPoints = [
    `${a1} cited a linked source for ${ins.linked1} of 10 types; ${a2} for ${ins.linked2} of 10.`,
    ins.unsourcedHigh.length ? `Scores of 2–3 lack a linked source in ${ins.listJoin(ins.unsourcedHigh)}. Treat those AI scores with caution.` : "Every AI score of 2–3 is backed by a linked source for its type.",
    vq ? `Source check on ${vq.code}: ${a1} — ${ins.verdictLabel(d.verification.ai1.verdict).toLowerCase()}; ${a2} — ${ins.verdictLabel(d.verification.ai2.verdict).toLowerCase()}.` : "The source check was not completed.",
    ins.declaredAny ? d.PRIVATE_CO_CAVEAT : null,
  ].filter(Boolean);
  const VW = [2000, CW - 2000 - 1900, 1900];
  const verifyRow = (which, parsed, name, color) => {
    const v = d.verification[which];
    const src = vq && v.src !== null && v.src !== undefined ? (parsed.sources[vq.type] || [])[v.src] : null;
    return row([
      td([p([r(name, { size: 9.5, bold: true, color })], { after: 1 }), p([r(`scored ${vq ? vq[which] : "—"} of 3`, { size: 8.5, color: MUTED })], { after: 0 })], VW[0]),
      td([
        p(src ? [src.url ? extLink(src.title || src.url, src.url, 9.5) : r(src.title, { size: 9.5 })] : [r("(no source selected)", { size: 9.5, italic: true, color: MUTED })], { after: v.note ? 2 : 0 }),
        ...(v.note ? [p([r(`“${v.note}”`, { size: 9, color: SLATE, italic: true })], { after: 0 })] : []),
      ], VW[1]),
      td(ins.verdictLabel(v.verdict), VW[2], { bold: true, size: 9 }),
    ]);
  };
  const CVW = [3000, (CW - 3000) / 2, (CW - 3000) / 2];
  const coverageRows = d.TYPES_ORDER.map(t => {
    const sc = (parsed, q) => {
      const st = d.sourceStatus(parsed, t), hi = d.highScoreUnsourced(parsed, q, t);
      return td([p([r(d.SOURCE_STATUS[st].label, { size: 9, bold: true, color: STATUS[st] })], { after: 0 }), ...(hi ? [p([r("2–3 scores unsourced", { size: 8, color: "B91C1C" })], { after: 0 })] : [])], CVW[1]);
    };
    return row([td(t, CVW[0], { bold: true }), sc(d.ai1Parsed, d.ai1Q), sc(d.ai2Parsed, d.ai2Q)]);
  });
  const evSection = [
    ...sectionHead("sec_evidence", "Section 4", "Evidence Quality", "How well the AI assessments are supported by verifiable sources, and what the team found when it checked them."),
    keyPoints(evPoints),
    keep([
      h3("Source verification", NAVY, { before: 12 }),
      ...(vq ? [
        note(`The team opened one cited source from each AI on a question where the AIs disagree: ${vq.code} — ${vq.text} (team score ${vq.team} of 3).`, { keepNext: true }),
        table([row([th("AI", VW[0]), th("Source checked and what it said", VW[1]), th("Verdict", VW[2])], { header: true }), verifyRow("ai1", d.ai1Parsed, a1, AI1), verifyRow("ai2", d.ai2Parsed, a2, AI2)], VW),
      ] : [note("Not completed.", { italic: true })]),
    ]),
    keep([
      h3("Source coverage by innovation type", NAVY, { before: 16 }),
      table([row([th("Innovation type", CVW[0]), th(a1, CVW[1]), th(a2, CVW[2])], { header: true }), ...coverageRows], CVW),
      note("Full citations with links are listed in Appendix B.", { after: 0 }),
    ]),
  ];

  // ---------- APPENDIX A ----------
  const appA = [
    ...sectionHead("sec_appA", "Appendix A", "Question-Level Scoring", `Every diagnostic question as answered by the team, ${a1}, and ${a2} on the shared rubric: 0 None, 1 Low, 2 Medium, 3 High, judged relative to direct competitors and industry norms.`),
    ...d.TYPES_ORDER.map(t => {
      const cat = d.TYPE_INFO[t].category, cc = CAT[cat];
      const tq = d.QUESTIONS.filter(q => q.type === t);
      const rows = tq.map((q, i) => {
        const key = `${t}:${i}`;
        return qRow({ code: d.questionCode(t, i), text: q.text, team: d.questionScores[key], ai1: d.ai1Q[key], ai2: d.ai2Q[key], ev1: d.ai1Parsed.evidence[key], ev2: d.ai2Parsed.evidence[key] }, null, true, i < tq.length - 1);
      });
      return ([
        p([r(t, { size: 12, bold: true, color: cc }), r(`   ${cat}  ·  Team ${fmt(d.teamTypeFinal[t])}  ·  ${a1} ${fmt(d.ai1Scores[t])}  ·  ${a2} ${fmt(d.ai2Scores[t])}`, { size: 8.5, color: MUTED })], { before: 14, after: 4, keepNext: true, border: { bottom: { style: BorderStyle.SINGLE, size: 6, color: cc, space: 2 } } }),
        table([qHeader(), ...rows], QW),
        ...(d.typeEvidence[t] ? [p([r("Team evidence: ", { size: 8.5, bold: true, color: cc }), r(d.typeEvidence[t], { size: 8.5, italic: true, color: SLATE })], { before: 3, after: 0 })] : []),
      ]);
    }).flat(),
  ];

  // ---------- APPENDIX B ----------
  const BW = [2400, CW - 2400];
  const citations = (parsed, name, color, first) => [
    p([r(`${name}  ·  Citations`, { size: 13, bold: true, color }), r(`     ${d.TYPES_ORDER.filter(t => d.sourceStatus(parsed, t) === "linked").length} of 10 types with a linked source`, { size: 9, color: MUTED })], { before: first ? 10 : 0, pageBreak: !first, after: 4, keepNext: true, border: { bottom: { style: BorderStyle.SINGLE, size: 12, color, space: 2 } } }),
    table(d.TYPES_ORDER.map(t => {
      const st = d.sourceStatus(parsed, t);
      const list = parsed.sources[t] || [];
      const items = list.map(src => src.url
        ? [p([extLink(src.title || src.url, src.url, 9)], { after: 0 }), p([r(src.url, { size: 7.5, color: MUTED })], { after: 3 })]
        : [p([r(src.title, { size: 9 }), r("  (no link)", { size: 9, italic: true, color: "B45309" })], { after: 3 })]).flat();
      if (st === "declared") items.push(p([r("No public source: ", { size: 9, italic: true, color: "B45309" }), r(parsed.noSource[t], { size: 9 })], { after: 0 }));
      if (st === "missing") items.push(p([r("No source given.", { size: 9, italic: true, color: "B91C1C" })], { after: 0 }));
      return row([td([p([r(t, { size: 9.5, bold: true })], { after: 1 }), p([r(d.SOURCE_STATUS[st].label, { size: 8, bold: true, color: STATUS[st] })], { after: 0 })], BW[0]), td(items, BW[1])]);
    }), BW),
  ];
  const appB = [
    ...sectionHead("sec_appB", "Appendix B", "AI Citations", `Sources each AI cited for each innovation type. Links open the cited page.${ins.declaredAny ? " " + d.PRIVATE_CO_CAVEAT : ""}`),
    ...citations(d.ai1Parsed, a1, AI1, true),
    ...citations(d.ai2Parsed, a2, AI2, false),
  ];

  // ---------- APPENDIX C ----------
  const method = (title, body) => keep([h3(title, NAVY, { before: 12 }), p([r(body, { size: 10 })], { after: 4, line: 1.2 })]);
  const appC = [
    ...sectionHead("sec_appC", "Appendix C", "Methodology", "How this assessment was produced."),
    method("Framework", "Doblin's Ten Types of Innovation (Keeley, Pikkel, Quinn & Walters, 2013) groups innovation into three categories: Configuration (Profit Model, Network, Structure, Process), Offering (Product Performance, Product System), and Experience (Service, Channel, Brand, Customer Engagement). Keeley's research found that companies innovating on five or more types at once markedly outperform single-type innovators."),
    method("Scoring instrument", `All three sources answered the same ${d.NQ} diagnostic questions on a 0–3 scale (0 None, 1 Low, 2 Medium, 3 High), judged relative to direct competitors and industry norms. Answers are weighted so that each type scores 0–10 regardless of its number of questions; the ten type scores sum to a Total Innovation Score out of 100. A type counts as strong at ${d.STRONG_THRESHOLD}.0 or above.`),
    method("Triangulation", `The team's assessment was compared with two independent AI assessments (${a1} and ${a2}) that received the same questions and rubric. Consensus means all three scores fall within 1.5 points; question-level gaps are reported where the team differs from the AI average by 1.5 points or more, or the AIs differ from each other by 2 points or more.`),
    method("Sources and verification", "Each AI was required to cite one to three sources per innovation type, to support every score of 2 or 3 with a source, and to state when no reliable public source exists. The team then opened one cited source from each AI on a disputed question and recorded whether it supported the score."),
    method("Limitations", "The assessment relies on public information and the judgment of the team and two AI models at the date shown, gathered in a time-boxed workshop. AI models can misstate facts or cite sources inaccurately; only a sample of citations was verified. Private companies disclose less, so some scores carry lower confidence. Recommendations are directional and would require further validation before investment."),
  ];

  // ---------- BACK PAGE ----------
  const back = [
    table([row([cell([p("")], { w: CW })], { height: 8400, rule: HeightRule.EXACT })], [CW]),
    table([row([cell([
      p([r(preparedBy, { font: SERIF, size: 20, color: "FFFFFF" })], { after: 4 }),
      p([r(`Innovation Portfolio Assessment  ·  ${company}  ·  ${d.dateStr}`, { size: 10, color: PALE })], { after: 10 }),
      p([r("")], { after: 8, border: { bottom: { style: BorderStyle.SINGLE, size: 12, color: GOLD, space: 1 } }, indent: { right: CW - 1300 } }),
      p([r("Framework: Keeley, L., Pikkel, R., Quinn, B., & Walters, H. (2013). ", { size: 8.5, color: PALE }), r("Ten Types of Innovation: The Discipline of Building Breakthroughs.", { size: 8.5, color: PALE, italic: true }), r(" Hoboken, NJ: Wiley.", { size: 8.5, color: PALE })], { after: 6, line: 1.2 }),
      p([r("This report was produced in a structured innovation workshop using public information and AI-assisted analysis. It is intended for discussion and is not investment advice.", { size: 8.5, color: PALE })], { after: 8, line: 1.2 }),
      p([r(`Innovation Workshop ${d.APP_VERSION}`, { size: 8, color: "8FA0B8" })], { after: 0 }),
    ], { w: CW, fill: NAVY, ml: 560, mr: 560, mt: 480, mb: 480 })])], [CW]),
  ];

  // ---------- header / footer ----------
  const header = new Header({ children: [p([r(`${company}  ·  Innovation Portfolio Assessment`, { size: 8, color: MUTED })], { align: AlignmentType.RIGHT, after: 0, border: { bottom: { style: BorderStyle.SINGLE, size: 4, color: RULE, space: 4 } } })] });
  const footer = new Footer({ children: [new Paragraph({
    tabStops: [{ type: TabStopType.RIGHT, position: CW }],
    border: { top: { style: BorderStyle.SINGLE, size: 4, color: RULE, space: 4 } },
    children: [r(`${preparedBy}  ·  Confidential`, { size: 8, color: MUTED }), new TextRun({ children: ["\tPage ", PageNumber.CURRENT], font: FONT, size: 16, color: MUTED })],
  })] });
  const blankHF = { default: new Header({ children: [new Paragraph({ children: [] })] }) };
  const blankF = { default: new Footer({ children: [new Paragraph({ children: [] })] }) };
  const pageProps = { page: { size: { width: PAGE_W, height: 15840 }, margin: { top: 1296, bottom: 1224, left: MARGIN, right: MARGIN, header: 576, footer: 576 } } };

  return new Document({
    creator: preparedBy,
    title: `${company} — Innovation Portfolio Assessment`,
    description: "Ten Types of Innovation diagnostic and strategic recommendations",
    styles: {
      default: { document: { run: { font: FONT, size: 21, color: INK } } },
      paragraphStyles: [
        { id: "Heading1", name: "Heading 1", basedOn: "Normal", next: "Normal", quickFormat: true, run: { font: SERIF, size: 48, color: NAVY, bold: false }, paragraph: { spacing: { before: 0, after: 120 }, keepNext: true, outlineLevel: 0 } },
      ],
    },
    sections: [
      { properties: pageProps, headers: blankHF, footers: blankF, children: cover },
      { properties: { ...pageProps, page: { ...pageProps.page, pageNumbers: { start: 1 } } }, headers: { default: header }, footers: { default: footer },
        children: [...contents, ...execSummary, ...recSection, ...profileSection, ...triSection, ...evSection, ...appA, ...appB, ...appC] },
      { properties: pageProps, headers: blankHF, footers: blankF, children: back },
    ],
  });
};

// ============================================================
// MAIN COMPONENT
// ============================================================

function InnovationWorkshop() {
  const [phase, setPhase] = useState(0);
  const [companyName, setCompanyName] = useState("");
  const [companyContext, setCompanyContext] = useState("");
  const [teamName, setTeamName] = useState("");

  const [questionScores, setQuestionScores] = useState(initialQuestionScores());
  const [typeEvidence, setTypeEvidence] = useState(initialTypeEvidence());

  const [ai1Name, setAi1Name] = useState("");
  const [ai1Raw, setAi1Raw] = useState("");
  const [ai1Edits, setAi1Edits] = useState({}); // manual per-question fixes, override parsed scores

  const [ai2Name, setAi2Name] = useState("");
  const [ai2Raw, setAi2Raw] = useState("");
  const [ai2Edits, setAi2Edits] = useState({});

  const [tacticRecs, setTacticRecs] = useState([]);
  const [verification, setVerification] = useState(initialVerification());

  const [copied1, setCopied1] = useState(false);
  const [copied2, setCopied2] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [summaryOpen, setSummaryOpen] = useState(false);
  const [summaryCopied, setSummaryCopied] = useState(false);

  // Load persisted
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(STORAGE_KEY);
        if (r && r.value) {
          const s = JSON.parse(r.value);
          if (s.companyName !== undefined) setCompanyName(s.companyName);
          if (s.companyContext !== undefined) setCompanyContext(s.companyContext);
          if (s.teamName !== undefined) setTeamName(s.teamName);
          if (s.questionScores) setQuestionScores(s.questionScores);
          if (s.typeEvidence) setTypeEvidence(s.typeEvidence);
          if (s.ai1Name) setAi1Name(s.ai1Name);
          if (s.ai1Raw) setAi1Raw(s.ai1Raw);
          if (s.ai1Edits) setAi1Edits(s.ai1Edits);
          if (s.ai2Name) setAi2Name(s.ai2Name);
          if (s.ai2Raw) setAi2Raw(s.ai2Raw);
          if (s.ai2Edits) setAi2Edits(s.ai2Edits);
          if (s.tacticRecs) setTacticRecs(s.tacticRecs.map(normalizeTactic));
          if (s.verification) setVerification({ ...initialVerification(), ...s.verification });
          if (typeof s.phase === "number") setPhase(s.phase);
        }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  // Persist
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify({
          phase, companyName, companyContext, teamName,
          questionScores, typeEvidence,
          ai1Name, ai1Raw, ai1Edits, ai2Name, ai2Raw, ai2Edits,
          tacticRecs, verification,
        }));
      } catch (e) {}
    })();
  }, [phase, companyName, companyContext, teamName, questionScores, typeEvidence,
      ai1Name, ai1Raw, ai1Edits, ai2Name, ai2Raw, ai2Edits, tacticRecs, verification, loaded]);

  // Parse AI responses question-by-question, apply manual fixes, roll up to type scores
  const ai1Parsed = useMemo(() => parseAIResponse(ai1Raw), [ai1Raw]);
  const ai2Parsed = useMemo(() => parseAIResponse(ai2Raw), [ai2Raw]);
  const ai1Q = useMemo(() => ({ ...ai1Parsed.scores, ...ai1Edits }), [ai1Parsed, ai1Edits]);
  const ai2Q = useMemo(() => ({ ...ai2Parsed.scores, ...ai2Edits }), [ai2Parsed, ai2Edits]);
  const ai1Scores = useMemo(() => rollUpTypeScores(ai1Q), [ai1Q]);
  const ai2Scores = useMemo(() => rollUpTypeScores(ai2Q), [ai2Q]);

  // Computed
  const teamTypeScores = useMemo(() => {
    const obj = {};
    TYPES_ORDER.forEach(t => { obj[t] = computeTypeScore(t, questionScores); });
    return obj;
  }, [questionScores]);

  const teamTypeFinal = useMemo(() => {
    const obj = {};
    TYPES_ORDER.forEach(t => { const s = teamTypeScores[t]; obj[t] = s.scored === s.total ? s.score : null; });
    return obj;
  }, [teamTypeScores]);

  const teamTotal = useMemo(() => totalFromTypeScores(teamTypeFinal), [teamTypeFinal]);
  const ai1Total = useMemo(() => totalFromTypeScores(ai1Scores), [ai1Scores]);
  const ai2Total = useMemo(() => totalFromTypeScores(ai2Scores), [ai2Scores]);

  // Question-level three-way comparison (the payoff of using one instrument for all three sources)
  const questionGaps = useMemo(() => {
    const rows = [];
    TYPES_ORDER.forEach(t => {
      QUESTIONS.filter(q => q.type === t).forEach((q, i) => {
        const key = `${t}:${i}`;
        const team = questionScores[key], a1 = ai1Q[key], a2 = ai2Q[key];
        if (typeof team !== "number" || typeof a1 !== "number" || typeof a2 !== "number") return;
        const aiMean = (a1 + a2) / 2;
        rows.push({
          key, type: t, idx: i, code: questionCode(t, i), text: q.text,
          team, ai1: a1, ai2: a2,
          teamVsAI: team - aiMean,
          aiSpread: Math.abs(a1 - a2),
          ev1: ai1Parsed.evidence[key] || "", ev2: ai2Parsed.evidence[key] || "",
        });
      });
    });
    return rows;
  }, [questionScores, ai1Q, ai2Q, ai1Parsed, ai2Parsed]);

  // Five-type threshold projection: strong types now (team) + weak types the chosen tactics attack
  const projectedStrong = useMemo(() => {
    const set = new Set(TYPES_ORDER.filter(t => typeof teamTypeFinal[t] === "number" && teamTypeFinal[t] >= STRONG_THRESHOLD));
    tacticRecs.forEach(r => set.add(r.type));
    return set.size;
  }, [teamTypeFinal, tacticRecs]);

  const teamComplete = useMemo(() => {
    return TYPES_ORDER.every(t => teamTypeScores[t].scored === teamTypeScores[t].total);
  }, [teamTypeScores]);

  const ai1Complete = useMemo(() => TYPES_ORDER.every(t => typeof ai1Scores[t] === "number"), [ai1Scores]);
  const ai2Complete = useMemo(() => TYPES_ORDER.every(t => typeof ai2Scores[t] === "number"), [ai2Scores]);

  const teamAvg = useMemo(() => {
    const vals = TYPES_ORDER.map(t => teamTypeScores[t].scored === teamTypeScores[t].total ? teamTypeScores[t].score : null).filter(v => v !== null);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }, [teamTypeScores]);

  const ai1Avg = useMemo(() => {
    const vals = TYPES_ORDER.map(t => ai1Scores[t]).filter(v => typeof v === "number");
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }, [ai1Scores]);

  const ai2Avg = useMemo(() => {
    const vals = TYPES_ORDER.map(t => ai2Scores[t]).filter(v => typeof v === "number");
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }, [ai2Scores]);

  const triangulation = useMemo(() => {
    const items = TYPES_ORDER.map(t => {
      const team = teamTypeScores[t].scored === teamTypeScores[t].total ? teamTypeScores[t].score : null;
      const a1 = ai1Scores[t];
      const a2 = ai2Scores[t];
      if (team == null || typeof a1 !== "number" || typeof a2 !== "number") return null;
      const aiAvg = (a1 + a2) / 2;
      return {
        type: t,
        team, ai1: a1, ai2: a2,
        aiAvg,
        teamVsAI: team - aiAvg,
        aiSpread: Math.abs(a1 - a2),
        spread: Math.max(team, a1, a2) - Math.min(team, a1, a2),
      };
    }).filter(Boolean);
    return items;
  }, [teamTypeScores, ai1Scores, ai2Scores]);

  const handleReset = async () => {
    if (!window.confirm("Reset everything? This will clear all scores, evidence, AI responses, and tactic recommendations.")) return;
    setPhase(0);
    setCompanyName(""); setCompanyContext(""); setTeamName("");
    setQuestionScores(initialQuestionScores());
    setTypeEvidence(initialTypeEvidence());
    setAi1Name(""); setAi1Raw(""); setAi1Edits({});
    setAi2Name(""); setAi2Raw(""); setAi2Edits({});
    setTacticRecs([]);
    setVerification(initialVerification());
    try { await window.storage.delete(STORAGE_KEY); } catch (e) {}
  };

  // ============================================================
  // REPORT INSIGHTS — plain-language findings generated from the scores
  // (shared by the Word report and the plain-text export)
  // ============================================================

  const buildInsights = () => {
    const num = (v) => typeof v === "number";
    const f1 = (v) => num(v) ? v.toFixed(1) : "—";
    const listJoin = (arr) => arr.length <= 1 ? arr.join("") : arr.length === 2 ? `${arr[0]} and ${arr[1]}` : `${arr.slice(0, -1).join(", ")}, and ${arr[arr.length - 1]}`;
    const company = companyName || "The company";
    const means = {};
    TYPES_ORDER.forEach(t => {
      const vals = [teamTypeFinal[t], ai1Scores[t], ai2Scores[t]].filter(num);
      means[t] = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    });
    const ranked = TYPES_ORDER.filter(t => num(means[t])).sort((a, b) => means[b] - means[a]);
    const tier = (m) => !num(m) ? "—" : m >= STRONG_THRESHOLD ? "Differentiator" : m >= 5 ? "Developing" : "Opportunity";
    const strengths = ranked.filter(t => means[t] >= STRONG_THRESHOLD);
    const topTypes = strengths.length ? strengths.slice(0, 3) : ranked.slice(0, 2);
    const gaps = [...ranked].reverse().filter(t => means[t] < 5).slice(0, 3);
    const bottomTypes = gaps.length ? gaps : [...ranked].reverse().slice(0, 2);
    const catMeans = CATEGORIES.map(cat => {
      const ts = TYPES_ORDER.filter(t => TYPE_INFO[t].category === cat && num(means[t]));
      return { cat, mean: ts.length ? ts.reduce((a, t) => a + means[t], 0) / ts.length : null };
    }).filter(c => num(c.mean)).sort((a, b) => b.mean - a.mean);
    const strongTeam = countStrong(teamTypeFinal), strongA1 = countStrong(ai1Scores), strongA2 = countStrong(ai2Scores);
    const maxStrong = Math.max(strongTeam, strongA1, strongA2);
    const biggestPerception = [...triangulation].sort((a, b) => Math.abs(b.teamVsAI) - Math.abs(a.teamVsAI))[0];
    const biggestAISplit = [...triangulation].sort((a, b) => b.aiSpread - a.aiSpread)[0];
    const consensus = triangulation.filter(i => i.spread <= 1.5);
    const linked1 = TYPES_ORDER.filter(t => sourceStatus(ai1Parsed, t) === "linked").length;
    const linked2 = TYPES_ORDER.filter(t => sourceStatus(ai2Parsed, t) === "linked").length;
    const declaredAny = [ai1Parsed, ai2Parsed].some(pp => TYPES_ORDER.some(t => sourceStatus(pp, t) === "declared"));
    const unsourcedHigh = [...new Set([
      ...TYPES_ORDER.filter(t => highScoreUnsourced(ai1Parsed, ai1Q, t)),
      ...TYPES_ORDER.filter(t => highScoreUnsourced(ai2Parsed, ai2Q, t)),
    ])];
    const vq = questionGaps.find(x => x.key === verification.qKey);
    const verdictLabel = (k) => (VERDICTS.find(v => v.key === k) || {}).label || "not recorded";
    const recCats = [...new Set(tacticRecs.map(r => TYPE_INFO[r.type].category))];
    const doublingDown = tacticRecs.filter(r => num(teamTypeFinal[r.type]) && teamTypeFinal[r.type] >= STRONG_THRESHOLD);
    const qIdentical = questionGaps.filter(g => g.team === g.ai1 && g.ai1 === g.ai2).length;
    const scopeTxt = companyContext.trim() ? ` (${companyContext.trim()})` : "";
    const a1 = ai1Name || "AI 1", a2 = ai2Name || "AI 2";

    const headline = `${company}${scopeTxt} scores ${f1(teamTotal)} out of 100 on the team's assessment, against ${f1(ai1Total)} from ${a1} and ${f1(ai2Total)} from ${a2}. By the team's scoring it is a strong innovator on ${strongTeam} of the ten types — ${strongTeam >= 5 ? "at or above" : "below"} the five-type threshold that Keeley's research associates with breakthrough performance${maxStrong >= 5 && strongTeam < 5 ? ", although at least one AI sees five or more strong types" : ""}.`;

    const findings = [];
    if (topTypes.length) findings.push({ title: strengths.length ? "Where the company already differentiates" : "Relative strengths", text: `${listJoin(topTypes)} ${topTypes.length === 1 ? "is" : "are"} the strongest ${topTypes.length === 1 ? "type" : "types"} across all three assessments (average ${topTypes.map(t => f1(means[t])).join(", ")} out of 10)${strengths.length ? "" : ", although none reaches the strong threshold of " + STRONG_THRESHOLD + ".0"}.` });
    if (bottomTypes.length) findings.push({ title: "Where the opportunities are", text: `${listJoin(bottomTypes)} show${bottomTypes.length === 1 ? "s" : ""} the least differentiation (average ${bottomTypes.map(t => f1(means[t])).join(", ")}). These are the types where competitors are least likely to expect a move.` });
    if (catMeans.length >= 2) findings.push({ title: "Category balance", text: `Innovation is concentrated in ${catMeans[0].cat} (average ${f1(catMeans[0].mean)}) and thinnest in ${catMeans[catMeans.length - 1].cat} (average ${f1(catMeans[catMeans.length - 1].mean)}).` });
    if (biggestPerception && Math.abs(biggestPerception.teamVsAI) >= 1.5) findings.push({ title: "Largest perception gap", text: `The team rates ${biggestPerception.type} ${Math.abs(biggestPerception.teamVsAI).toFixed(1)} points ${biggestPerception.teamVsAI > 0 ? "higher" : "lower"} than the two AIs on average (team ${f1(biggestPerception.team)}, ${a1} ${f1(biggestPerception.ai1)}, ${a2} ${f1(biggestPerception.ai2)}). Either the team has information the public record lacks, or it is ${biggestPerception.teamVsAI > 0 ? "overrating" : "underrating"} this type.` });
    findings.push({ title: "Confidence in the evidence", text: `${a1} cited linked sources for ${linked1} of 10 types and ${a2} for ${linked2}.${vq ? ` When the team opened one cited source from each AI (${vq.code}), the verdicts were: ${a1} — ${verdictLabel(verification.ai1.verdict).toLowerCase()}; ${a2} — ${verdictLabel(verification.ai2.verdict).toLowerCase()}.` : " The source check was not completed."}` });

    return {
      means, ranked, tier, strengths, topTypes, bottomTypes, catMeans, strongTeam, strongA1, strongA2,
      biggestPerception, biggestAISplit, consensus, linked1, linked2, declaredAny, unsourcedHigh, vq,
      verdictLabel, recCats, doublingDown, qIdentical, headline, findings, a1, a2, f1, listJoin,
    };
  };

  // ============================================================
  // EXPORT — consulting-style Word report (HTML+MSO) + plain-text fallback
  // ============================================================

  const buildWordHTML = () => {
    const ins = buildInsights();
    const { f1, a1, a2 } = ins;
    const E = escapeHTML;
    const dateStr = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    const company = companyName || "The Company";
    const scope = companyContext.trim();
    const preparedBy = teamName ? teamName : "Workshop Team";

    // Palette — navy/slate consulting look; data colors match the app
    const NAVY = "#0B1F3A", INK = "#1F2937", SLATE = "#475569", MUTED = "#64748B", RULE = "#D9DEE5", TINT = "#F3F5F8", ACCENT = "#B8860B";
    const catColorHex = (cat) => ({ Configuration: "#6D28D9", Offering: "#047857", Experience: "#C2410C" })[cat];
    const teamColorHex = "#C2410C", ai1ColorHex = "#0F766E", ai2ColorHex = "#6D28D9";
    const fmt = (v) => v !== null && v !== undefined && !isNaN(v) ? v.toFixed(2) : "—";
    const tierHex = { Differentiator: "#047857", Developing: "#B45309", Opportunity: "#B91C1C", "—": MUTED };

    // Layout helpers
    const PB = `<p class="pb" style="page-break-before:always;mso-break-type:page-break;margin:0;line-height:1pt;font-size:1pt;">&nbsp;</p>`;
    // Keep a block on one page: a single-row table whose row may not split across pages
    const keep = (inner, mt = 0) => `<table class="keep" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:${mt}pt 0 0 0;"><tr style="page-break-inside:avoid;"><td style="padding:0;border:none;">${inner}</td></tr></table>`;
    const kicker = (t) => `<p class="kicker">${t}</p>`;
    const sectionHead = (id, num, title, sub) => `
<a name="${id}"></a>
${kicker(num)}
<h1 id="${id}">${title}</h1>
${sub ? `<p class="lede">${sub}</p>` : ""}`;
    const keyPoints = (points, label = "Key points") => keep(`
<table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:6pt 0 12pt;">
  <tr style="page-break-inside:avoid;"><td style="background:${TINT};border-left:3pt solid ${NAVY};padding:9pt 14pt;">
    <p style="margin:0 0 4pt;font-size:8.5pt;letter-spacing:1.5pt;text-transform:uppercase;color:${NAVY};font-weight:bold;">${label}</p>
    ${points.map(p => `<p style="margin:3pt 0;font-size:10pt;color:${INK};line-height:1.35;">&#9656;&nbsp; ${p}</p>`).join("")}
  </td></tr>
</table>`);
    const chip = (text, color) => `<span style="font-size:7.5pt;font-weight:bold;letter-spacing:0.5pt;text-transform:uppercase;color:${color};border:0.75pt solid ${color};padding:0 3pt;">${E(text)}</span>`;

    // ---------- Score tiles ----------
    const tile = (label, total, strong, color, extra) => `
      <td style="width:33%;border-top:2.25pt solid ${color};background:${TINT};padding:9pt 12pt;vertical-align:top;">
        <p style="margin:0;font-size:8pt;letter-spacing:1pt;text-transform:uppercase;color:${MUTED};font-weight:bold;">${E(label)}</p>
        <p style="margin:2pt 0 0;font-family:Georgia,serif;font-size:24pt;color:${color};line-height:1.05;">${f1(total)}<span style="font-size:10pt;color:${MUTED};font-family:Calibri,Arial,sans-serif;"> / 100</span></p>
        <p style="margin:3pt 0 0;font-size:8.5pt;color:${SLATE};">Strong types: <strong>${strong}</strong> of 10${extra ? ` &middot; ${extra}` : ""}</p>
      </td>`;
    const tileRow = `<table cellpadding="0" cellspacing="6" style="width:100%;border-collapse:separate;margin:4pt 0 10pt;"><tr style="page-break-inside:avoid;">
      ${tile("Team assessment", teamTotal, ins.strongTeam, teamColorHex)}
      ${tile(a1, ai1Total, ins.strongA1, ai1ColorHex, `${ins.linked1}/10 sourced`)}
      ${tile(a2, ai2Total, ins.strongA2, ai2ColorHex, `${ins.linked2}/10 sourced`)}
    </tr></table>`;

    // ---------- Recommendations ----------
    const recSummaryRows = tacticRecs.map((r, i) => {
      const cat = TYPE_INFO[r.type].category;
      return `<tr style="page-break-inside:avoid;">
        <td style="width:30pt;vertical-align:top;padding:7pt 6pt 7pt 0;border-bottom:0.5pt solid ${RULE};"><p style="margin:0;font-family:Georgia,serif;font-size:20pt;color:${NAVY};line-height:1;">${i + 1}</p></td>
        <td style="vertical-align:top;padding:7pt 0;border-bottom:0.5pt solid ${RULE};">
          <p style="margin:0;font-size:12pt;font-weight:bold;color:${NAVY};">${E(r.name)} <span style="font-size:8.5pt;font-weight:normal;color:${catColorHex(cat)};">&nbsp;${E(r.type)} &middot; ${cat}</span></p>
          <p style="margin:2pt 0 0;font-size:9.5pt;color:${INK};"><strong>Why:</strong> ${E((r.gap || "").trim() || "—")}</p>
          <p style="margin:1pt 0 0;font-size:9.5pt;color:${INK};"><strong>What it takes:</strong> ${E((r.adoption || "").trim() || "—")}</p>
        </td></tr>`;
    }).join("");
    const impactLine = tacticRecs.length
      ? `If these moves succeed, ${E(company)} would have up to <strong>${projectedStrong}</strong> strong innovation types (from ${ins.strongTeam} today)${projectedStrong >= 5 ? ", reaching the five-type threshold" : `, still ${5 - projectedStrong} short of the five-type threshold`}. The portfolio spans ${ins.recCats.length} of 3 categories (${ins.recCats.join(", ")}).`
      : "";
    const recBox = keep(`
<table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:8pt 0 0;">
  <tr style="page-break-inside:avoid;"><td style="border:1.5pt solid ${NAVY};padding:10pt 14pt;">
    <p style="margin:0;font-size:8.5pt;letter-spacing:1.5pt;text-transform:uppercase;color:${ACCENT};font-weight:bold;">Our recommendations</p>
    <p style="margin:2pt 0 4pt;font-family:Georgia,serif;font-size:15pt;color:${NAVY};">${tacticRecs.length ? `${tacticRecs.length} moves for ${E(company)}` : "No recommendations recorded"}</p>
    ${tacticRecs.length ? `<table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;">${recSummaryRows}</table>
    <p style="margin:7pt 0 0;font-size:9.5pt;color:${SLATE};">${impactLine}</p>` : ""}
  </td></tr>
</table>`);

    const recCard = (r, i) => {
      const cat = TYPE_INFO[r.type].category, cc = catColorHex(cat);
      const tdef = TACTICS.find(x => x.type === r.type && x.name === r.name);
      const strong = typeof teamTypeFinal[r.type] === "number" && teamTypeFinal[r.type] >= STRONG_THRESHOLD;
      const field = (label, val) => `<tr style="page-break-inside:avoid;"><td style="width:120pt;vertical-align:top;padding:5pt 8pt 5pt 0;border-top:0.5pt solid ${RULE};"><p style="margin:0;font-size:8.5pt;letter-spacing:0.8pt;text-transform:uppercase;color:${MUTED};font-weight:bold;">${label}</p></td><td style="vertical-align:top;padding:5pt 0;border-top:0.5pt solid ${RULE};"><p style="margin:0;font-size:10pt;color:${INK};line-height:1.35;">${E((val || "").trim() || "(not recorded)")}</p></td></tr>`;
      return keep(`
<table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:12pt 0 0;">
  <tr style="page-break-inside:avoid;"><td style="border-top:2.25pt solid ${cc};padding:8pt 0 0;">
    <table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;"><tr>
      <td style="width:44pt;vertical-align:top;"><p style="margin:0;font-family:Georgia,serif;font-size:30pt;color:${NAVY};line-height:1;">${String(i + 1).padStart(2, "0")}</p></td>
      <td style="vertical-align:top;">
        <p style="margin:0;font-size:8.5pt;letter-spacing:1pt;text-transform:uppercase;color:${cc};font-weight:bold;">${E(r.type)} &middot; ${cat}${strong ? ` &nbsp;${chip("Builds on a strength", "#047857")}` : ""}</p>
        <p style="margin:1pt 0 2pt;font-family:Georgia,serif;font-size:16pt;color:${NAVY};">${E(r.name)}</p>
        ${tdef ? `<p style="margin:0;font-size:9.5pt;color:${SLATE};font-style:italic;">${E(tdef.desc)}</p>` : ""}
        <p style="margin:4pt 0 0;font-size:8.5pt;color:${MUTED};">Current ${E(r.type)} score: Team <strong style="color:${teamColorHex};">${fmt(teamTypeFinal[r.type])}</strong> &middot; ${E(a1)} <strong style="color:${ai1ColorHex};">${fmt(ai1Scores[r.type])}</strong> &middot; ${E(a2)} <strong style="color:${ai2ColorHex};">${fmt(ai2Scores[r.type])}</strong></p>
      </td></tr></table>
    <table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin-top:6pt;">
      ${field("The opportunity", r.gap)}${field("Supporting evidence", r.evidence)}${field("What adoption requires", r.adoption)}
    </table>
  </td></tr>
</table>`);
    };

    // ---------- Innovation profile ----------
    const profileRows = TYPES_ORDER.map((t, idx) => {
      const cat = TYPE_INFO[t].category;
      const tr = ins.tier(ins.means[t]);
      const prevCat = idx > 0 ? TYPE_INFO[TYPES_ORDER[idx - 1]].category : null;
      const catCell = cat !== prevCat ? `<span style="color:${catColorHex(cat)};font-weight:bold;">${cat}</span>` : "";
      return `<tr style="page-break-inside:avoid;">
        <td class="c" style="width:78pt;font-size:8.5pt;">${catCell}</td>
        <td class="c"><strong>${E(t)}</strong></td>
        <td class="c n" style="color:${teamColorHex};">${fmt(teamTypeFinal[t])}</td>
        <td class="c n" style="color:${ai1ColorHex};">${fmt(ai1Scores[t])}</td>
        <td class="c n" style="color:${ai2ColorHex};">${fmt(ai2Scores[t])}</td>
        <td class="c n"><strong>${f1(ins.means[t])}</strong></td>
        <td class="c" style="width:70pt;"><span style="font-size:8pt;font-weight:bold;color:${tierHex[tr]};">${tr}</span></td>
      </tr>`;
    }).join("");
    const profileTable = keep(`
<table class="data" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:4pt 0 0;">
  <tr style="page-break-inside:avoid;"><th class="h">Category</th><th class="h">Innovation type</th><th class="h n">Team</th><th class="h n">${E(a1)}</th><th class="h n">${E(a2)}</th><th class="h n">Average</th><th class="h">Position</th></tr>
  ${profileRows}
  <tr style="page-break-inside:avoid;"><td class="t" colspan="2"><strong>Total Innovation Score (0–100)</strong></td><td class="t n" style="color:${teamColorHex};"><strong>${f1(teamTotal)}</strong></td><td class="t n" style="color:${ai1ColorHex};"><strong>${f1(ai1Total)}</strong></td><td class="t n" style="color:${ai2ColorHex};"><strong>${f1(ai2Total)}</strong></td><td class="t" colspan="2"></td></tr>
  <tr style="page-break-inside:avoid;"><td class="c" colspan="2">Strong types (score ≥ ${STRONG_THRESHOLD})</td><td class="c n">${ins.strongTeam}</td><td class="c n">${ins.strongA1}</td><td class="c n">${ins.strongA2}</td><td class="c" colspan="2"></td></tr>
  <tr style="page-break-inside:avoid;"><td class="c" colspan="2">Types with a linked source</td><td class="c n">—</td><td class="c n">${ins.linked1}/10</td><td class="c n">${ins.linked2}/10</td><td class="c" colspan="2"></td></tr>
</table>
<p class="note">Type scores run 0–10 and sum to the Total Innovation Score. Position uses the three-source average: Differentiator ≥ ${STRONG_THRESHOLD}.0, Developing 5.0–6.9, Opportunity &lt; 5.0.</p>`);

    // Bar chart (tables only, so it renders in Word)
    const CHART_H = 140, BAR_W = 10, GROUP_GAP = 7;
    const SHORT = { "Profit Model": "Profit<br/>Model", "Product Performance": "Product<br/>Perf.", "Product System": "Product<br/>System", "Customer Engagement": "Customer<br/>Engage." };
    const vbar = (val, color) => {
      const v = typeof val === "number" ? val : 0;
      const filled = Math.max(0.5, (v / 10) * CHART_H), empty = CHART_H - filled;
      return `<td style="vertical-align:bottom;padding:0 0.75pt;">
        <p style="margin:0 0 1pt;font-size:6.5pt;text-align:center;color:${color};font-weight:bold;">${typeof val === "number" ? val.toFixed(1) : "—"}</p>
        <table cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:${BAR_W}pt;">
          <tr><td style="height:${empty.toFixed(1)}pt;font-size:1pt;line-height:1pt;mso-line-height-rule:exactly;">&nbsp;</td></tr>
          <tr><td style="height:${filled.toFixed(1)}pt;font-size:1pt;line-height:1pt;background:${color};mso-line-height-rule:exactly;">&nbsp;</td></tr>
        </table></td>`;
    };
    const chart = keep(`
<p class="fig">Exhibit 1 &middot; Score by innovation type, three assessments (0–10)</p>
<table cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:4pt auto 0;">
  <tr style="height:${CHART_H + 12}pt;">${TYPES_ORDER.map((t, idx) => `<td style="vertical-align:bottom;padding:0 0 0 ${idx ? GROUP_GAP : 0}pt;border-bottom:0.75pt solid ${SLATE};"><table cellpadding="0" cellspacing="0" style="border-collapse:collapse;"><tr>${vbar(teamTypeFinal[t], teamColorHex)}${vbar(ai1Scores[t], ai1ColorHex)}${vbar(ai2Scores[t], ai2ColorHex)}</tr></table></td>`).join("")}</tr>
  <tr>${TYPES_ORDER.map((t, idx) => `<td style="text-align:center;vertical-align:top;padding:4pt 0 0 ${idx ? GROUP_GAP : 0}pt;font-size:7pt;color:${SLATE};line-height:1.15;">${SHORT[t] || t}</td>`).join("")}</tr>
</table>
<p style="text-align:center;margin:6pt 0 0;font-size:8.5pt;color:${SLATE};">${[["Team", teamColorHex], [a1, ai1ColorHex], [a2, ai2ColorHex]].map(([n, c]) => `<span style="color:${c};font-size:10pt;">&#9632;</span> ${E(n)}`).join(" &nbsp;&nbsp;&nbsp; ")}</p>`, 10);

    // ---------- Triangulation ----------
    const consensusItems = ins.consensus.slice().sort((a, b) => b.team - a.team).slice(0, 4);
    const teamVsAIs = [...triangulation].sort((a, b) => Math.abs(b.teamVsAI) - Math.abs(a.teamVsAI)).slice(0, 3);
    const aisDisagree = [...triangulation].sort((a, b) => b.aiSpread - a.aiSpread).slice(0, 3);
    const patternRow = (it, note) => `<tr style="page-break-inside:avoid;"><td class="c" style="width:120pt;"><strong>${E(it.type)}</strong></td>
      <td class="c n" style="color:${teamColorHex};">${it.team.toFixed(1)}</td><td class="c n" style="color:${ai1ColorHex};">${it.ai1.toFixed(1)}</td><td class="c n" style="color:${ai2ColorHex};">${it.ai2.toFixed(1)}</td>
      <td class="c" style="font-size:9pt;color:${SLATE};">${E(note || "")}</td></tr>`;
    const patternBlock = (title, desc, color, items, noteFn) => keep(`
<p class="h3" style="color:${color};margin-top:12pt;">${title}</p>
<p class="note" style="margin-top:0;">${desc}</p>
<table class="data" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;">
  <tr><th class="h">Type</th><th class="h n">Team</th><th class="h n">${E(a1)}</th><th class="h n">${E(a2)}</th><th class="h">Observation</th></tr>
  ${items.length ? items.map(it => patternRow(it, noteFn ? noteFn(it) : "All three within 1.5 points")).join("") : `<tr><td class="c" colspan="5"><em style="color:${MUTED};">None.</em></td></tr>`}
</table>`);

    const qCell = (v, color) => `<td class="c n" style="width:30pt;color:${color};font-weight:bold;">${typeof v === "number" ? v : "—"}</td>`;
    const qRowHtml = (g, note) => `<tr style="page-break-inside:avoid;">
      <td class="c" style="width:30pt;vertical-align:top;"><strong>${g.code}</strong></td>
      <td class="c" style="vertical-align:top;">${E(g.text)}
        ${note ? `<p style="margin:2pt 0 0;font-size:8.5pt;color:${MUTED};">${note}</p>` : ""}
        ${g.ev1 ? `<p style="margin:2pt 0 0;font-size:8.5pt;color:${SLATE};"><span style="color:${ai1ColorHex};font-weight:bold;">${E(a1)}:</span> ${E(g.ev1)}</p>` : ""}
        ${g.ev2 ? `<p style="margin:1pt 0 0;font-size:8.5pt;color:${SLATE};"><span style="color:${ai2ColorHex};font-weight:bold;">${E(a2)}:</span> ${E(g.ev2)}</p>` : ""}
      </td>${qCell(g.team, teamColorHex)}${qCell(g.ai1, ai1ColorHex)}${qCell(g.ai2, ai2ColorHex)}</tr>`;
    const qHead = `<tr><th class="h">Code</th><th class="h">Question and AI evidence</th><th class="h n">Team</th><th class="h n">AI 1</th><th class="h n">AI 2</th></tr>`;
    const qGapTeam = [...questionGaps].filter(g => Math.abs(g.teamVsAI) >= 1.5).sort((a, b) => Math.abs(b.teamVsAI) - Math.abs(a.teamVsAI)).slice(0, 6);
    const qGapAI = [...questionGaps].filter(g => g.aiSpread >= 2).sort((a, b) => b.aiSpread - a.aiSpread).slice(0, 4);
    const qTable = (rows, noteFn) => rows.length
      ? `<table class="data" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;">${qHead}${rows.map(g => qRowHtml(g, noteFn(g))).join("")}</table>`
      : `<p class="note"><em>None at this threshold.</em></p>`;

    // ---------- Evidence quality ----------
    const statusHex = { linked: "#047857", unlinked: "#B45309", declared: "#B45309", missing: "#B91C1C" };
    const coverageRows = TYPES_ORDER.map(t => {
      const s1 = sourceStatus(ai1Parsed, t), s2 = sourceStatus(ai2Parsed, t);
      const h1 = highScoreUnsourced(ai1Parsed, ai1Q, t), h2 = highScoreUnsourced(ai2Parsed, ai2Q, t);
      const cell = (s, h) => `<td class="c" style="font-size:9pt;color:${statusHex[s]};font-weight:bold;">${SOURCE_STATUS[s].label}${h ? `<br/><span style="font-weight:normal;color:#B91C1C;font-size:8pt;">2–3 scores unsourced</span>` : ""}</td>`;
      return `<tr style="page-break-inside:avoid;"><td class="c"><strong>${E(t)}</strong></td>${cell(s1, h1)}${cell(s2, h2)}</tr>`;
    }).join("");
    const vq = ins.vq;
    const verifyRow = (which, parsed, name, color) => {
      const v = verification[which];
      const src = vq && v.src !== null && v.src !== undefined ? (parsed.sources[vq.type] || [])[v.src] : null;
      const srcHtml = src ? (src.url ? `<a href="${E(src.url)}" style="color:#1D4ED8;">${E(src.title || src.url)}</a>` : E(src.title)) : "<em>(none selected)</em>";
      return `<tr style="page-break-inside:avoid;"><td class="c" style="width:110pt;vertical-align:top;"><strong style="color:${color};">${E(name)}</strong><br/><span style="font-size:8.5pt;color:${MUTED};">scored ${vq ? vq[which] : "—"} of 3</span></td>
        <td class="c" style="vertical-align:top;font-size:9.5pt;">${srcHtml}${v.note ? `<br/><span style="color:${SLATE};">“${E(v.note)}”</span>` : ""}</td>
        <td class="c" style="width:95pt;vertical-align:top;font-size:9pt;font-weight:bold;">${E(ins.verdictLabel(v.verdict))}</td></tr>`;
    };

    // ---------- Appendix A: question-level scoring ----------
    const appendixA = TYPES_ORDER.map(t => {
      const cat = TYPE_INFO[t].category, cc = catColorHex(cat);
      const rows = QUESTIONS.filter(q => q.type === t).map((q, i) => {
        const key = `${t}:${i}`;
        const e1 = ai1Parsed.evidence[key], e2 = ai2Parsed.evidence[key];
        return `<tr style="page-break-inside:avoid;"><td class="c" style="width:30pt;vertical-align:top;"><strong>${questionCode(t, i)}</strong></td>
          <td class="c" style="vertical-align:top;">${E(q.text)}
            ${e1 ? `<p style="margin:2pt 0 0;font-size:8pt;color:${SLATE};"><span style="color:${ai1ColorHex};font-weight:bold;">${E(a1)}:</span> ${E(e1)}</p>` : ""}
            ${e2 ? `<p style="margin:1pt 0 0;font-size:8pt;color:${SLATE};"><span style="color:${ai2ColorHex};font-weight:bold;">${E(a2)}:</span> ${E(e2)}</p>` : ""}
          </td>${qCell(questionScores[key], teamColorHex)}${qCell(ai1Q[key], ai1ColorHex)}${qCell(ai2Q[key], ai2ColorHex)}</tr>`;
      }).join("");
      return keep(`
<p class="h3" style="color:${cc};margin-top:14pt;border-bottom:0.75pt solid ${cc};padding-bottom:2pt;">${E(t)} <span style="font-size:9pt;color:${MUTED};font-weight:normal;">&middot; ${cat} &middot; Team ${fmt(teamTypeFinal[t])} &middot; ${E(a1)} ${fmt(ai1Scores[t])} &middot; ${E(a2)} ${fmt(ai2Scores[t])}</span></p>
<table class="data" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;">${qHead}${rows}</table>
${typeEvidence[t] ? `<p class="note"><strong style="color:${cc};">Team evidence:</strong> <em>${E(typeEvidence[t])}</em></p>` : ""}`);
    }).join("");

    // ---------- Appendix B: citations ----------
    const citationBlock = (parsed, name, color) => {
      const rows = TYPES_ORDER.map(t => {
        const st = sourceStatus(parsed, t);
        const list = parsed.sources[t] || [];
        const items = list.map(src => src.url
          ? `<p style="margin:1pt 0;font-size:9pt;"><a href="${E(src.url)}" style="color:#1D4ED8;">${E(src.title || src.url)}</a><br/><span style="font-size:7.5pt;color:${MUTED};">${E(src.url)}</span></p>`
          : `<p style="margin:1pt 0;font-size:9pt;">${E(src.title)} <em style="color:#B45309;">(no link)</em></p>`).join("");
        const none = st === "declared" ? `<p style="margin:1pt 0;font-size:9pt;color:#B45309;"><em>No public source:</em> ${E(parsed.noSource[t])}</p>` : "";
        const miss = st === "missing" ? `<p style="margin:1pt 0;font-size:9pt;color:#B91C1C;"><em>No source given.</em></p>` : "";
        return `<tr style="page-break-inside:avoid;"><td class="c" style="width:115pt;vertical-align:top;"><strong>${E(t)}</strong><br/><span style="font-size:8pt;font-weight:bold;color:${statusHex[st]};">${SOURCE_STATUS[st].label}</span></td><td class="c" style="vertical-align:top;">${items}${none}${miss}</td></tr>`;
      }).join("");
      return `
<p class="h3" style="color:${color};margin-top:14pt;border-bottom:1.5pt solid ${color};padding-bottom:2pt;">${E(name)} &middot; Citations <span style="font-size:9pt;color:${MUTED};font-weight:normal;">&middot; ${TYPES_ORDER.filter(t => sourceStatus(parsed, t) === "linked").length} of 10 types with a linked source</span></p>
<table class="data" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;">${rows}</table>`;
    };

    // ---------- Section key points ----------
    const recPoints = [];
    if (tacticRecs.length) {
      recPoints.push(`${tacticRecs.length} recommended moves across ${ins.recCats.length} of 3 innovation categories (${ins.recCats.join(", ")}).${ins.recCats.length === 1 && tacticRecs.length > 1 ? " A single-category portfolio is easier for competitors to copy; the team should be ready to defend the focus." : ""}`);
      recPoints.push(`Path to five: strong types rise from ${ins.strongTeam} to as many as ${projectedStrong} if every move succeeds${projectedStrong >= 5 ? " — enough to clear the five-type threshold" : ""}.`);
